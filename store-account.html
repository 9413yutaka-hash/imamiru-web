<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071a33">
  <title>店舗・施設アカウント｜マチナウ</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- 正式店舗参加基盤 Phase 1｜店舗・施設・主催者の「人のアカウント」の画面。
       新規登録・メール確認・ログイン・ログアウト・パスワード再設定だけを行う。
       ・パスワードはFirebase Authenticationへブラウザから直接渡すだけ(Firestore・
         独自API・ログへは一切送らない)
       ・旅行者側の匿名認証(既定のFirebase app)と状態を混ぜないため、この画面は
         名前付きの別Firebase app("machinauStoreAccount")のAuthだけを使う。
         既定appのfirebase.auth()はこの画面から一度も呼ばない
       ・ログインできても店舗権限・Admin権限・Editor権限は何も付与しない
         (店舗との紐付けはPhase 2のstoreMembers)。店舗tokenも発行しない
       ・固定文言はtranslations.jsのstore_account_*キー(JA/EN) -->

  <style>
    :root {
      --navy: #071a33;
      --blue: #0788c9;
      --cyan: #04b7d7;
      --sky: #dff7ff;
      --green: #19a96b;
      --red: #e0525e;
      --white: #ffffff;
      --text: #15233a;
      --subtext: #697386;
      --border: #e2eaf1;
      --background: #f4f8fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--navy), #0d294a);
      color: var(--white);
      padding: 14px 16px 18px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    header .page-label { font-size: 12px; opacity: 0.85; }
    header h1 { margin: 6px 0 2px; font-size: 22px; }
    header p { margin: 0; font-size: 13px; opacity: 0.9; }

    .language-switch { display: flex; gap: 4px; flex-shrink: 0; }

    .language-switch button {
      min-height: 32px;
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      background: transparent;
      color: var(--white);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--white);
      color: var(--navy);
      font-weight: 800;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 16px 60px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel h2 { margin: 0 0 12px; font-size: 17px; color: var(--navy); }

    .note { margin: 0; font-size: 12.5px; color: var(--subtext); line-height: 1.7; }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--navy);
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
    }

    .hint { margin: 6px 0 0; font-size: 12px; color: var(--subtext); }

    .check-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .check-line input { margin-top: 4px; width: 18px; height: 18px; flex-shrink: 0; }
    .check-line a { color: var(--blue); }

    .primary-button, .secondary-button {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }

    .primary-button {
      border: none;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: var(--white);
    }

    .secondary-button {
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--navy);
      margin-top: 10px;
    }

    .primary-button:disabled, .secondary-button:disabled { opacity: 0.55; cursor: default; }

    .link-list { margin-top: 14px; display: grid; gap: 8px; font-size: 13.5px; }

    .link-button {
      border: none;
      background: none;
      padding: 4px 0;
      color: var(--blue);
      font-size: 13.5px;
      font-family: inherit;
      text-align: left;
      text-decoration: underline;
      cursor: pointer;
    }

    .message {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
    }

    .message.show { display: block; }
    .message.error { background: #fdecee; color: #a3212d; }
    .message.success { background: #e5f7ef; color: #0f6b44; }
    .message.info { background: var(--sky); color: var(--navy); }
    .message .error-code { display: block; margin-top: 4px; font-size: 11px; opacity: 0.75; }

    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      background: var(--white);
      color: var(--text);
    }

    .store-section, .store-verify-required {
      margin: 6px 0 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .store-section h3, .store-form h3 { margin: 0 0 10px; font-size: 15px; color: var(--navy); }
    .store-form { margin-top: 14px; }

    .store-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }

    .store-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .store-card-name { font-size: 15px; font-weight: 800; color: var(--navy); }
    .store-card-meta { margin-top: 2px; color: var(--subtext); }
    .store-card-note { margin-top: 6px; font-size: 12px; color: var(--subtext); }

    .store-card-link {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--sky);
      color: var(--navy);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .store-status {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: var(--sky);
      color: var(--navy);
    }

    .store-status.active { background: #e5f7ef; color: #0f6b44; }
    .store-status.pending_review { background: #fff4e5; color: #8a4b00; }
    .store-status.rejected, .store-status.suspended { background: #fdecee; color: #a3212d; }

    .store-preview {
      margin: 12px 0;
      padding: 12px;
      border-radius: 12px;
      background: var(--background);
      font-size: 13px;
    }

    .store-preview p { margin: 0 0 4px; }
    .store-preview-title { font-weight: 800; color: var(--navy); }
    .store-preview-address { overflow-wrap: anywhere; }
    .store-preview-warning { color: #8a4b00; }
    .store-preview a { color: var(--blue); font-size: 13px; }

    .status-list { margin: 0 0 14px; display: grid; gap: 8px; font-size: 13.5px; }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .status-row .status-label { color: var(--subtext); flex-shrink: 0; }
    .status-row .status-value { font-weight: 800; text-align: right; overflow-wrap: anywhere; }
    .status-value.ok { color: var(--green); }
    .status-value.pending { color: var(--red); }

    .back-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--blue);
      font-size: 13px;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="page-label" data-i18n="store_account_page_label">マチナウ 店舗・施設アカウント</div>
      <div class="language-switch" role="group" aria-label="Language">
        <button type="button" data-language="ja" aria-pressed="true">日本語</button>
        <button type="button" data-language="en" aria-pressed="false">English</button>
      </div>
    </div>
    <h1 id="pageHeading" data-i18n="store_account_title_login">ログイン</h1>
    <p data-i18n="store_account_intro">お店・施設・イベント主催者の方のためのアカウントです。</p>
  </header>

  <main>
    <div class="panel">
      <p class="note" data-i18n="store_account_phase_note"></p>
    </div>

    <div id="globalMessage" class="message" role="status" aria-live="polite"></div>

    <!-- ログイン -->
    <section class="panel" id="loginView" hidden>
      <h2 data-i18n="store_account_title_login">ログイン</h2>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail" data-i18n="store_account_email_label">メールアドレス</label>
          <input type="email" id="loginEmail" autocomplete="username" inputmode="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="loginPassword" data-i18n="store_account_password_label">パスワード</label>
          <input type="password" id="loginPassword" autocomplete="current-password" maxlength="128" required>
        </div>
        <label class="check-line">
          <input type="checkbox" data-show-password="loginPassword">
          <span data-i18n="store_account_show_password">パスワードを表示する</span>
        </label>
        <button type="submit" class="primary-button" data-i18n="store_account_login_button">ログインする</button>
      </form>
      <div class="link-list">
        <button type="button" class="link-button" data-go-view="reset" data-i18n="store_account_forgot">パスワードを忘れた方</button>
        <button type="button" class="link-button" data-go-view="signup" data-i18n="store_account_to_signup">はじめての方：新規アカウント登録</button>
      </div>
    </section>

    <!-- 新規登録 -->
    <section class="panel" id="signupView" hidden>
      <h2 data-i18n="store_account_title_signup">新規アカウント登録</h2>
      <form id="signupForm" novalidate>
        <div class="field">
          <label for="signupEmail" data-i18n="store_account_email_label">メールアドレス</label>
          <input type="email" id="signupEmail" autocomplete="username" inputmode="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="signupPassword" data-i18n="store_account_password_label">パスワード</label>
          <input type="password" id="signupPassword" autocomplete="new-password" maxlength="128" required>
          <p class="hint" data-i18n="store_account_password_hint">8文字以上で入力してください。</p>
        </div>
        <div class="field">
          <label for="signupPasswordConfirm" data-i18n="store_account_password_confirm_label">パスワード（確認）</label>
          <input type="password" id="signupPasswordConfirm" autocomplete="new-password" maxlength="128" required>
        </div>
        <label class="check-line">
          <input type="checkbox" data-show-password="signupPassword signupPasswordConfirm">
          <span data-i18n="store_account_show_password">パスワードを表示する</span>
        </label>
        <label class="check-line">
          <input type="checkbox" id="signupAgree">
          <span>
            <span data-i18n="store_account_agree_prefix"></span><a href="terms.html" target="_blank" rel="noopener" data-i18n="store_account_agree_terms_link">利用規約</a><span data-i18n="store_account_agree_and">と</span><a href="privacy.html" target="_blank" rel="noopener" data-i18n="store_account_agree_privacy_link">プライバシーポリシー</a><span data-i18n="store_account_agree_suffix">に同意します</span>
            <span class="hint" data-i18n="store_account_legal_ja_only"></span>
          </span>
        </label>
        <button type="submit" class="primary-button" data-i18n="store_account_signup_button">アカウントを作成する</button>
      </form>
      <div class="link-list">
        <button type="button" class="link-button" data-go-view="login" data-i18n="store_account_to_login">登録済みの方：ログイン</button>
      </div>
    </section>

    <!-- パスワード再設定 -->
    <section class="panel" id="resetView" hidden>
      <h2 data-i18n="store_account_title_reset">パスワード再設定</h2>
      <p class="note" style="margin-bottom: 12px;" data-i18n="store_account_reset_intro"></p>
      <form id="resetForm" novalidate>
        <div class="field">
          <label for="resetEmail" data-i18n="store_account_email_label">メールアドレス</label>
          <input type="email" id="resetEmail" autocomplete="username" inputmode="email" maxlength="254" required>
        </div>
        <button type="submit" class="primary-button" data-i18n="store_account_reset_button">再設定メールを送る</button>
      </form>
      <div class="link-list">
        <button type="button" class="link-button" data-go-view="login" data-i18n="store_account_back_to_login">ログイン画面へ戻る</button>
      </div>
    </section>

    <!-- ログイン後 -->
    <section class="panel" id="accountView" hidden>
      <h2 data-i18n="store_account_status_logged_in">ログインしています</h2>
      <div class="status-list">
        <div class="status-row">
          <span class="status-label" data-i18n="store_account_status_email_label">メールアドレス</span>
          <span class="status-value" id="accountEmail"></span>
        </div>
        <div class="status-row">
          <span class="status-label" data-i18n="store_account_status_verify_label">メール確認</span>
          <span class="status-value" id="accountVerified"></span>
        </div>
        <div class="status-row">
          <span class="status-label" data-i18n="store_account_status_store_link_label">店舗との紐付け</span>
          <span class="status-value" id="accountStoreLink"></span>
        </div>
      </div>

      <!-- Phase 2A｜セルフ店舗登録。メール確認済みのアカウントだけに表示する。
           店舗の作成・所在地の確定・token非発行はすべてサーバー側で行う。 -->
      <p class="note store-verify-required" id="storeVerifyRequired" hidden data-i18n="store_account_store_verify_required"></p>

      <div class="store-section" id="storeSection" hidden>
        <h3 data-i18n="store_account_stores_heading">あなたの店舗・施設</h3>
        <p class="note" id="storeListEmpty" hidden data-i18n="store_account_stores_empty"></p>
        <ul class="store-list" id="storeList"></ul>
        <div id="storeMessage" class="message" role="status" aria-live="polite"></div>
        <button type="button" class="primary-button" id="openStoreFormButton" data-i18n="store_account_store_open_form">店舗・施設を登録する</button>

        <form id="storeForm" class="store-form" hidden novalidate>
          <h3 data-i18n="store_account_store_form_heading">店舗・施設の登録</h3>
          <div class="field">
            <label for="storeNameInput" data-i18n="store_account_store_name_label">店舗・施設名</label>
            <input type="text" id="storeNameInput" maxlength="60" autocomplete="organization" required>
          </div>
          <div class="field">
            <label for="storeCategorySelect" data-i18n="store_account_store_category_label">カテゴリ</label>
            <select id="storeCategorySelect" required></select>
          </div>
          <div class="field">
            <label for="storeCountrySelect" data-i18n="store_account_store_country_label">国・地域</label>
            <select id="storeCountrySelect" required></select>
          </div>
          <div class="field">
            <label for="storeAddressInput" data-i18n="store_account_store_address_label">住所</label>
            <input type="text" id="storeAddressInput" maxlength="200" autocomplete="street-address" required>
            <p class="hint" data-i18n="store_account_store_address_hint"></p>
          </div>
          <button type="button" class="secondary-button" id="storePreviewButton" data-i18n="store_account_store_preview_button">所在地を確認する</button>

          <div class="store-preview" id="storePreviewBox" hidden>
            <p class="store-preview-title" data-i18n="store_account_store_preview_title">見つかった所在地</p>
            <p class="store-preview-address" id="storePreviewAddress"></p>
            <p class="store-preview-region" id="storePreviewRegion"></p>
            <p class="hint store-preview-warning" id="storePreviewPartial" hidden data-i18n="store_account_store_preview_partial"></p>
            <a id="storePreviewMapLink" href="#" target="_blank" rel="noopener" data-i18n="store_account_store_preview_map">地図で場所を確認する</a>
            <p class="hint" data-i18n="store_account_store_preview_confirm_hint"></p>
          </div>

          <button type="submit" class="primary-button" id="storeRegisterButton" disabled data-i18n="store_account_store_register_button">この内容で登録する</button>
          <button type="button" class="secondary-button" id="storeFormCancelButton" data-i18n="store_account_store_cancel_button">やめる</button>
        </form>
      </div>

      <div id="unverifiedBox" hidden>
        <p class="message info show" data-i18n="store_account_verify_needed"></p>
        <p class="note" style="margin-bottom: 10px;" data-i18n="store_account_verify_spam_hint"></p>
        <button type="button" class="primary-button" id="refreshButton" data-i18n="store_account_refresh_button">確認が済んだら：状態を更新する</button>
        <button type="button" class="secondary-button" id="resendButton" data-i18n="store_account_resend_button">確認メールを再送する</button>
      </div>

      <button type="button" class="secondary-button" id="logoutButton" data-i18n="store_account_logout_button">ログアウトする</button>
    </section>

    <a class="back-link" href="index.html" data-i18n="store_account_back_to_top">← マチナウTOPへ</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="translations.js"></script>

  <script>
    (function () {
      "use strict";

      // TOP(app.js)と同じlocalStorageキーで言語を共有する。
      const LANGUAGE_STORAGE_KEY = "machinauLanguage";
      const STORE_AUTH_APP_NAME = "machinauStoreAccount";
      const PASSWORD_MIN_LENGTH = 8;
      const PASSWORD_MAX_LENGTH = 128;
      // 確認メール送信の待機時間(マチナウ側の安全策。Firebase側の解除時間ではない)。
      const VERIFY_NEXT_ALLOWED_AT_STORAGE_KEY = "machinauStoreVerifyNextAllowedAt";
      const VERIFY_COOLDOWN_MILLISECONDS = 2 * 60 * 1000;
      const VERIFY_COOLDOWN_TOO_MANY_MILLISECONDS = 24 * 60 * 60 * 1000;
      const VERIFY_SEND_DELAY_AFTER_SIGNUP_MILLISECONDS = 5 * 1000;
      const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      const VIEW_HEADINGS = {
        login: "store_account_title_login",
        signup: "store_account_title_signup",
        reset: "store_account_title_reset",
        account: "store_account_title_account"
      };

      // Firebase Authのエラーcode → 画面文言キー。存在するアカウントかどうか等の
      // 内部情報が分からないよう、ログイン失敗系はすべて同じ文言にまとめる。
      const AUTH_ERROR_MESSAGE_KEYS = {
        "auth/email-already-in-use": "store_account_err_email_in_use",
        "auth/invalid-email": "store_account_err_email_invalid",
        "auth/missing-email": "store_account_err_email_required",
        "auth/weak-password": "store_account_err_weak_password",
        "auth/password-does-not-meet-requirements": "store_account_err_weak_password",
        "auth/missing-password": "store_account_err_password_required",
        "auth/user-not-found": "store_account_err_login_failed",
        "auth/wrong-password": "store_account_err_login_failed",
        "auth/invalid-credential": "store_account_err_login_failed",
        "auth/invalid-login-credentials": "store_account_err_login_failed",
        "auth/user-disabled": "store_account_err_user_disabled",
        "auth/too-many-requests": "store_account_err_too_many",
        "auth/network-request-failed": "store_account_err_network",
        "auth/operation-not-allowed": "store_account_err_not_allowed",
        "auth/admin-restricted-operation": "store_account_err_not_allowed"
      };

      let currentLanguage = readLanguage();
      let currentView = "login";
      let storeAuth = null;
      let busy = false;
      let lastMessage = null;
      let verificationSendPending = false;
      let verificationSending = false;
      let verificationSendTimerId = 0;
      let verificationCooldownFallbackUntil = 0;
      let resendTimerId = 0;

      function readLanguage() {
        let stored = null;
        try {
          stored = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        } catch (error) {
          stored = null;
        }
        return typeof stored === "string" && MACHINAU_SUPPORTED_LANGUAGES.includes(stored)
          ? stored
          : MACHINAU_DEFAULT_LANGUAGE;
      }

      function t(key) {
        return getMachinauTranslation(key, currentLanguage);
      }

      function applyLanguage() {
        document.documentElement.lang = currentLanguage;
        document.title = t("store_account_doc_title");
        document.querySelectorAll("[data-i18n]").forEach(function (element) {
          element.textContent = t(element.getAttribute("data-i18n"));
        });
        document.getElementById("pageHeading").textContent = t(VIEW_HEADINGS[currentView]);
        document.querySelectorAll("[data-language]").forEach(function (button) {
          button.setAttribute("aria-pressed", button.getAttribute("data-language") === currentLanguage ? "true" : "false");
        });
        if (storeAuth) {
          storeAuth.languageCode = currentLanguage;
        }
        buildStoreSelectOptions();
        renderAccount();
        updateResendButton();
        renderStorePreview();
        if (lastMessage) {
          showMessage(lastMessage.key, lastMessage.type, lastMessage.code);
        }
        if (lastStoreMessage) {
          showStoreMessage(lastStoreMessage.key, lastStoreMessage.type, lastStoreMessage.code);
        }
      }

      // codeはFirebaseのエラーcode(例：auth/too-many-requests)。調査しやすいよう
      // 文言の後ろに小さく添える(個人情報・内部情報は含まない固定の識別子のみ)。
      function showMessage(key, type, code) {
        const box = document.getElementById("globalMessage");
        lastMessage = { key: key, type: type, code: code || "" };
        box.textContent = t(key);
        if (code) {
          const codeElement = document.createElement("span");
          codeElement.className = "error-code";
          codeElement.textContent = "(" + code + ")";
          box.appendChild(codeElement);
        }
        box.className = "message show " + type;
      }

      function clearMessage() {
        const box = document.getElementById("globalMessage");
        lastMessage = null;
        box.textContent = "";
        box.className = "message";
      }

      function showAuthError(error) {
        const code = error && typeof error.code === "string" ? error.code : "";
        showMessage(AUTH_ERROR_MESSAGE_KEYS[code] || "store_account_err_generic", "error");
      }

      function showView(view) {
        currentView = view;
        ["login", "signup", "reset", "account"].forEach(function (name) {
          document.getElementById(name + "View").hidden = name !== view;
        });
        document.getElementById("pageHeading").textContent = t(VIEW_HEADINGS[view]);
      }

      function setBusy(form, isBusy) {
        busy = isBusy;
        const scope = form || document;
        scope.querySelectorAll("button").forEach(function (button) {
          button.disabled = isBusy;
        });
        if (!isBusy) {
          // 一括で有効化した再送ボタン・店舗登録ボタンを、それぞれの状態に合わせて戻す。
          updateResendButton();
          updateStoreRegisterButton();
        }
      }

      function readEmail(inputId) {
        return document.getElementById(inputId).value.trim();
      }

      function validateEmail(email) {
        if (email === "") {
          return "store_account_err_email_required";
        }
        if (email.length > 254 || !EMAIL_PATTERN.test(email)) {
          return "store_account_err_email_invalid";
        }
        return "";
      }

      function renderAccount() {
        const user = storeAuth ? storeAuth.currentUser : null;
        if (!user) {
          return;
        }
        document.getElementById("accountEmail").textContent = user.email || "";
        const verifiedElement = document.getElementById("accountVerified");
        verifiedElement.textContent = t(user.emailVerified ? "store_account_status_verified" : "store_account_status_unverified");
        verifiedElement.className = "status-value " + (user.emailVerified ? "ok" : "pending");
        document.getElementById("unverifiedBox").hidden = user.emailVerified === true;
        updateResendButton();
        renderStoreSection();
      }

      // ===== Phase 2A｜セルフ店舗登録 =====
      // 店舗の作成・所在地の確定・運営確認への振り分け・token非発行はすべてサーバーが
      // 行う。この画面は入力と結果表示だけで、Firestoreへ直接アクセスしない。

      // サーバーのカテゴリcodeと同じ並び(api/_lib/store-self-service.js)。
      const STORE_CATEGORY_CODES = [
        "gourmet",
        "cafe_sweets",
        "shopping",
        "sightseeing_experience",
        "nightlife",
        "beauty_relaxation",
        "lodging",
        "other"
      ];

      // ISO 3166-1 alpha-2。国名は言語ごとにブラウザ標準のIntl.DisplayNamesで表示する
      // (国名の翻訳表を持たない)。日本を初期値にする。
      const STORE_COUNTRY_CODES = (
        "AD AE AF AG AI AL AM AO AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BW BY BZ " +
        "CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR " +
        "GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GT GU GW GY HK HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP " +
        "KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ " +
        "NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW " +
        "SA SB SC SD SE SG SH SI SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TG TH TJ TK TL TM TN TO TR TT TV TW TZ " +
        "UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW"
      ).split(" ");
      const STORE_DEFAULT_COUNTRY = "JP";

      // サーバーの理由code → 画面文言キー。
      const STORE_ERROR_MESSAGE_KEYS = {
        email_not_verified: "store_account_store_err_verify",
        login_required: "store_account_store_err_login",
        store_account_required: "store_account_store_err_login",
        address_not_found: "store_account_store_err_address_not_found",
        location_too_coarse: "store_account_store_err_too_coarse",
        country_mismatch: "store_account_store_err_country_mismatch",
        geocoding_unavailable: "store_account_store_err_geocoding",
        already_registered: "store_account_store_err_already_registered",
        rate_limited: "store_account_store_err_rate_limited"
      };
      const STORE_FIELD_ERROR_KEYS = {
        storeName: "store_account_store_err_name",
        categoryCode: "store_account_store_err_category",
        countryCode: "store_account_store_err_country",
        address: "store_account_store_err_address"
      };

      let myStores = [];
      let storesLoadedForUid = "";
      let storesLoading = false;
      let storeRequestPending = false;
      let storePreviewKey = "";
      let storePreviewLocation = null;
      let lastStoreMessage = null;

      function getCountryDisplayName(code) {
        try {
          const names = new Intl.DisplayNames([currentLanguage], { type: "region" });
          return names.of(code) || code;
        } catch (error) {
          return code;
        }
      }

      function buildStoreSelectOptions() {
        const categorySelect = document.getElementById("storeCategorySelect");
        const countrySelect = document.getElementById("storeCountrySelect");
        const selectedCategory = categorySelect.value;
        const selectedCountry = countrySelect.value || STORE_DEFAULT_COUNTRY;

        categorySelect.textContent = "";
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = t("store_account_store_category_placeholder");
        categorySelect.appendChild(placeholder);
        STORE_CATEGORY_CODES.forEach(function (code) {
          const option = document.createElement("option");
          option.value = code;
          option.textContent = t("store_account_category_" + code);
          categorySelect.appendChild(option);
        });
        categorySelect.value = selectedCategory;

        const countries = STORE_COUNTRY_CODES
          .map(function (code) {
            return { code: code, name: getCountryDisplayName(code) };
          })
          .sort(function (first, second) {
            if (first.code === STORE_DEFAULT_COUNTRY) return -1;
            if (second.code === STORE_DEFAULT_COUNTRY) return 1;
            return first.name.localeCompare(second.name, currentLanguage);
          });
        countrySelect.textContent = "";
        countries.forEach(function (country) {
          const option = document.createElement("option");
          option.value = country.code;
          option.textContent = country.name;
          countrySelect.appendChild(option);
        });
        countrySelect.value = selectedCountry;
      }

      function showStoreMessage(key, type, code) {
        const box = document.getElementById("storeMessage");
        lastStoreMessage = { key: key, type: type, code: code || "" };
        box.textContent = t(key);
        if (code) {
          const codeElement = document.createElement("span");
          codeElement.className = "error-code";
          codeElement.textContent = "(" + code + ")";
          box.appendChild(codeElement);
        }
        box.className = "message show " + type;
      }

      function clearStoreMessage() {
        const box = document.getElementById("storeMessage");
        lastStoreMessage = null;
        box.textContent = "";
        box.className = "message";
      }

      function showStoreError(status, result) {
        const reason = result && typeof result.reason === "string" ? result.reason : "";
        if (reason === "invalid_input" && result.field && STORE_FIELD_ERROR_KEYS[result.field]) {
          return showStoreMessage(STORE_FIELD_ERROR_KEYS[result.field], "error");
        }
        showStoreMessage(STORE_ERROR_MESSAGE_KEYS[reason] || "store_account_err_generic", "error", reason || (status ? "http_" + status : ""));
      }

      function callStoreApi(body) {
        const user = storeAuth && storeAuth.currentUser;
        if (!user) {
          return Promise.resolve({ status: 401, result: { reason: "login_required" } });
        }
        return user.getIdToken()
          .then(function (idToken) {
            return fetch("/api/moderate-submission", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + idToken
              },
              body: JSON.stringify(body)
            });
          })
          .then(function (response) {
            return response.json()
              .catch(function () {
                return null;
              })
              .then(function (result) {
                return { status: response.status, result: result };
              });
          });
      }

      function renderStoreLinkStatus() {
        const element = document.getElementById("accountStoreLink");
        element.textContent = myStores.length > 0
          ? t("store_account_status_store_count").replace("{n}", myStores.length)
          : t("store_account_status_store_link_none");
      }

      function renderStoreList() {
        const list = document.getElementById("storeList");
        list.textContent = "";
        myStores.forEach(function (store) {
          const item = document.createElement("li");
          item.className = "store-card";

          const name = document.createElement("div");
          name.className = "store-card-name";
          name.textContent = store.storeName;
          item.appendChild(name);

          const meta = document.createElement("div");
          meta.className = "store-card-meta";
          meta.textContent = [
            store.categoryCode ? t("store_account_category_" + store.categoryCode) : "",
            [getCountryDisplayName(store.countryCode), store.prefecture, store.city]
              .filter(Boolean)
              .join(" ")
          ].filter(Boolean).join("｜");
          item.appendChild(meta);

          const status = document.createElement("span");
          const statusCode = ["active", "pending_review", "rejected", "suspended"].includes(store.registrationStatus)
            ? store.registrationStatus
            : "active";
          status.className = "store-status " + statusCode;
          status.textContent = t("store_account_store_status_" + statusCode);
          item.appendChild(status);

          const note = document.createElement("div");
          note.className = "store-card-note";
          note.textContent = t("store_account_store_note_" + statusCode);
          item.appendChild(note);

          // Phase 2B｜常設店舗情報の編集画面へ。編集できる(登録済み)店舗だけに出す
          // (編集できるかの最終判定はサーバー)。
          if (statusCode === "active") {
            const editLink = document.createElement("a");
            editLink.className = "store-card-link";
            editLink.href = "store-profile.html?store=" + encodeURIComponent(store.storeId);
            editLink.textContent = t("store_profile_edit_link");
            item.appendChild(editLink);
          }

          list.appendChild(item);
        });
        document.getElementById("storeListEmpty").hidden = myStores.length > 0 || storesLoading;
        renderStoreLinkStatus();
      }

      function renderStoreSection() {
        const user = storeAuth ? storeAuth.currentUser : null;
        const verified = !!(user && user.emailVerified);
        document.getElementById("storeSection").hidden = !verified;
        document.getElementById("storeVerifyRequired").hidden = !user || verified;
        renderStoreList();
        if (verified && storesLoadedForUid !== user.uid && !storesLoading) {
          loadMyStores();
        }
      }

      function loadMyStores() {
        const user = storeAuth && storeAuth.currentUser;
        if (!user) {
          return Promise.resolve();
        }
        const uid = user.uid;
        storesLoading = true;
        return callStoreApi({ mode: "storeMyStores" })
          .then(function (response) {
            if (!storeAuth.currentUser || storeAuth.currentUser.uid !== uid) {
              return;
            }
            if (response.status === 200 && response.result && Array.isArray(response.result.stores)) {
              myStores = response.result.stores;
              storesLoadedForUid = uid;
            } else {
              showStoreError(response.status, response.result);
            }
          })
          .catch(function () {
            showStoreMessage("store_account_err_network", "error");
          })
          .finally(function () {
            storesLoading = false;
            renderStoreList();
          });
      }

      function resetStoreState() {
        myStores = [];
        storesLoadedForUid = "";
        closeStoreForm();
        clearStoreMessage();
        renderStoreLinkStatus();
      }

      function readStoreForm() {
        return {
          storeName: document.getElementById("storeNameInput").value.trim(),
          categoryCode: document.getElementById("storeCategorySelect").value,
          countryCode: document.getElementById("storeCountrySelect").value,
          address: document.getElementById("storeAddressInput").value.trim()
        };
      }

      function validateStoreForm(values) {
        if (values.storeName === "") return "store_account_store_err_name";
        if (values.categoryCode === "") return "store_account_store_err_category";
        if (values.countryCode === "") return "store_account_store_err_country";
        if (values.address === "") return "store_account_store_err_address";
        return "";
      }

      // 所在地を確認した後に国・住所を変えたら、確認をやり直すまで登録できない。
      function invalidateStorePreview() {
        const values = readStoreForm();
        if (storePreviewKey !== values.countryCode + "|" + values.address) {
          storePreviewKey = "";
          storePreviewLocation = null;
          document.getElementById("storePreviewBox").hidden = true;
        }
        updateStoreRegisterButton();
      }

      function updateStoreRegisterButton() {
        const values = readStoreForm();
        document.getElementById("storeRegisterButton").disabled =
          storeRequestPending ||
          storePreviewKey === "" ||
          storePreviewKey !== values.countryCode + "|" + values.address;
        document.getElementById("storePreviewButton").disabled = storeRequestPending;
      }

      function renderStorePreview() {
        if (!storePreviewLocation) {
          return;
        }
        const location = storePreviewLocation;
        document.getElementById("storePreviewAddress").textContent = location.formattedAddress;
        document.getElementById("storePreviewRegion").textContent = [
          getCountryDisplayName(location.countryCode),
          location.prefecture,
          location.city
        ].filter(Boolean).join(" ");
        document.getElementById("storePreviewPartial").hidden = location.partialMatch !== true;
        document.getElementById("storePreviewMapLink").href =
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(location.latitude + "," + location.longitude);
        document.getElementById("storePreviewBox").hidden = false;
      }

      function openStoreForm() {
        clearStoreMessage();
        document.getElementById("storeForm").hidden = false;
        document.getElementById("openStoreFormButton").hidden = true;
        document.getElementById("storeNameInput").focus();
      }

      function closeStoreForm() {
        const form = document.getElementById("storeForm");
        form.reset();
        document.getElementById("storeCountrySelect").value = STORE_DEFAULT_COUNTRY;
        form.hidden = true;
        document.getElementById("openStoreFormButton").hidden = false;
        storePreviewKey = "";
        storePreviewLocation = null;
        document.getElementById("storePreviewBox").hidden = true;
        updateStoreRegisterButton();
      }

      function handleStorePreview() {
        if (storeRequestPending) {
          return;
        }
        clearStoreMessage();
        const values = readStoreForm();
        const invalidKey = validateStoreForm(values);
        if (invalidKey) {
          return showStoreMessage(invalidKey, "error");
        }
        storeRequestPending = true;
        updateStoreRegisterButton();
        callStoreApi({
          mode: "storeRegistrationPreview",
          countryCode: values.countryCode,
          address: values.address
        })
          .then(function (response) {
            if (response.status === 200 && response.result && response.result.location) {
              storePreviewKey = values.countryCode + "|" + values.address;
              storePreviewLocation = response.result.location;
              renderStorePreview();
            } else {
              showStoreError(response.status, response.result);
            }
          })
          .catch(function () {
            showStoreMessage("store_account_err_network", "error");
          })
          .finally(function () {
            storeRequestPending = false;
            updateStoreRegisterButton();
          });
      }

      function handleStoreRegister(event) {
        event.preventDefault();
        const values = readStoreForm();
        if (storeRequestPending) {
          return;
        }
        if (storePreviewKey !== values.countryCode + "|" + values.address) {
          // 所在地の確認前(Enterキー等)は、登録せず確認だけを行う。
          return handleStorePreview();
        }
        clearStoreMessage();
        const invalidKey = validateStoreForm(values);
        if (invalidKey) {
          return showStoreMessage(invalidKey, "error");
        }
        storeRequestPending = true;
        updateStoreRegisterButton();
        callStoreApi({
          mode: "storeSelfRegister",
          storeName: values.storeName,
          categoryCode: values.categoryCode,
          countryCode: values.countryCode,
          address: values.address,
          sourceLanguage: currentLanguage
        })
          .then(function (response) {
            if (response.status === 200 && response.result && response.result.success) {
              closeStoreForm();
              showStoreMessage(
                response.result.registrationStatus === "pending_review"
                  ? "store_account_store_registered_pending"
                  : "store_account_store_registered_active",
                response.result.registrationStatus === "pending_review" ? "info" : "success"
              );
              storesLoadedForUid = "";
              return loadMyStores();
            }
            showStoreError(response.status, response.result);
          })
          .catch(function () {
            showStoreMessage("store_account_err_network", "error");
          })
          .finally(function () {
            storeRequestPending = false;
            updateStoreRegisterButton();
          });
      }

      // 次に確認メールを送ってよい時刻(ミリ秒)だけをlocalStorageへ保存する。
      // メール・uid・token等は保存しない。ブラウザ単位で効く(同じ端末で別の
      // アカウントへ切り替えても待機は続く＝不要な送信要求を増やさない側に倒す)。
      function readNextVerificationAllowedAt() {
        let stored = null;
        try {
          stored = localStorage.getItem(VERIFY_NEXT_ALLOWED_AT_STORAGE_KEY);
        } catch (error) {
          stored = null;
        }
        const value = Number(stored);
        if (!Number.isFinite(value) || value <= 0) {
          return 0;
        }
        // 端末時計の変更等で極端に先の時刻になっていても、最長の待機時間を超えない。
        return Math.min(value, Date.now() + VERIFY_COOLDOWN_TOO_MANY_MILLISECONDS);
      }

      function startVerificationCooldown(milliseconds) {
        try {
          localStorage.setItem(VERIFY_NEXT_ALLOWED_AT_STORAGE_KEY, String(Date.now() + milliseconds));
        } catch (error) {
          // 保存できない環境でも、このページを開いている間の待機は下の再描画で効く。
        }
        verificationCooldownFallbackUntil = Date.now() + milliseconds;
        updateResendButton();
      }

      function getVerificationCooldownRemaining() {
        const nextAllowedAt = Math.max(readNextVerificationAllowedAt(), verificationCooldownFallbackUntil);
        return Math.max(0, nextAllowedAt - Date.now());
      }

      function formatRemaining(milliseconds) {
        const totalSeconds = Math.ceil(milliseconds / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) {
          return t("store_account_duration_hours_minutes").replace("{h}", hours).replace("{m}", minutes);
        }
        return minutes + ":" + String(seconds).padStart(2, "0");
      }

      // 再送ボタンは、自動送信の待機中・送信中・待機時間中は押せない。
      // 「状態を更新する」ボタンはメールを送らないため、ここでは触らない。
      function updateResendButton() {
        const button = document.getElementById("resendButton");
        const remaining = getVerificationCooldownRemaining();
        if (verificationSendPending || verificationSending) {
          button.disabled = true;
          button.textContent = t("store_account_verify_preparing_button");
        } else if (remaining > 0) {
          button.disabled = true;
          button.textContent = t("store_account_resend_available_in").replace("{time}", formatRemaining(remaining));
        } else {
          button.disabled = false;
          button.textContent = t("store_account_resend_button");
        }
        if (remaining > 0 && !resendTimerId) {
          resendTimerId = window.setInterval(function () {
            updateResendButton();
          }, 1000);
        } else if (remaining <= 0 && resendTimerId) {
          window.clearInterval(resendTimerId);
          resendTimerId = 0;
        }
      }

      // 1回の操作につき送信要求は最大1回。Firebase標準の確認メールを、戻り先URL
      // (actionCodeSettings)なしで1回だけ送る。失敗しても同じ操作内で送り直さない。
      // 結果に応じて次に送ってよい時刻を設定する(成功・その他の失敗は2分、
      // auth/too-many-requestsは24時間。Firebase側の解除時間を意味するものではなく、
      // マチナウ側で不要な再送要求を出さないための安全策)。
      function sendVerificationEmail(user) {
        verificationSending = true;
        updateResendButton();
        return user.sendEmailVerification()
          .then(function () {
            startVerificationCooldown(VERIFY_COOLDOWN_MILLISECONDS);
          }, function (error) {
            const code = error && error.code;
            startVerificationCooldown(code === "auth/too-many-requests" ? VERIFY_COOLDOWN_TOO_MANY_MILLISECONDS : VERIFY_COOLDOWN_MILLISECONDS);
            throw error;
          })
          .finally(function () {
            verificationSending = false;
            updateResendButton();
          });
      }

      function showVerificationSendError(error) {
        const code = error && typeof error.code === "string" ? error.code : "";
        if (code === "auth/too-many-requests") {
          return showMessage("store_account_err_verify_too_many", "error", code);
        }
        showMessage(AUTH_ERROR_MESSAGE_KEYS[code] || "store_account_err_generic", "error", code);
      }

      // 新規登録の直後にすぐ送ると拒否されやすいため、約5秒待ってから1回だけ送る。
      // 待機中にログアウト・別アカウントへの切替・確認済み化が起きたら送らない。
      // 待機時間中(このブラウザで直前に送信/制限があった)なら送らずに案内だけ出す。
      function scheduleVerificationAfterSignup(user) {
        const uid = user.uid;
        if (getVerificationCooldownRemaining() > 0) {
          showMessage("store_account_verify_cooldown_active", "info");
          updateResendButton();
          return;
        }
        verificationSendPending = true;
        updateResendButton();
        showMessage("store_account_verify_preparing", "info");
        window.clearTimeout(verificationSendTimerId);
        verificationSendTimerId = window.setTimeout(function () {
          verificationSendPending = false;
          const current = storeAuth.currentUser;
          if (!current || current.uid !== uid || current.emailVerified) {
            updateResendButton();
            return;
          }
          sendVerificationEmail(current)
            .then(function () {
              showMessage("store_account_verify_sent", "success");
            })
            .catch(showVerificationSendError);
        }, VERIFY_SEND_DELAY_AFTER_SIGNUP_MILLISECONDS);
      }

      function cancelScheduledVerification() {
        window.clearTimeout(verificationSendTimerId);
        verificationSendTimerId = 0;
        verificationSendPending = false;
        updateResendButton();
      }

      function handleSignup(event) {
        event.preventDefault();
        if (busy) {
          return;
        }
        clearMessage();
        const form = event.currentTarget;
        const email = readEmail("signupEmail");
        const password = document.getElementById("signupPassword").value;
        const passwordConfirm = document.getElementById("signupPasswordConfirm").value;

        const emailError = validateEmail(email);
        if (emailError) {
          return showMessage(emailError, "error");
        }
        if (password === "") {
          return showMessage("store_account_err_password_required", "error");
        }
        if (password.length < PASSWORD_MIN_LENGTH) {
          return showMessage("store_account_err_password_short", "error");
        }
        if (password.length > PASSWORD_MAX_LENGTH) {
          return showMessage("store_account_err_password_long", "error");
        }
        if (password.toLowerCase() === email.toLowerCase()) {
          return showMessage("store_account_err_password_same_email", "error");
        }
        if (password !== passwordConfirm) {
          return showMessage("store_account_err_password_mismatch", "error");
        }
        if (!document.getElementById("signupAgree").checked) {
          return showMessage("store_account_err_agree_required", "error");
        }

        setBusy(form, true);
        storeAuth.createUserWithEmailAndPassword(email, password)
          .then(function (credential) {
            // アカウント作成はここで完了。確認メールの送信は別処理(約5秒後に1回)で、
            // 送信に失敗してもアカウント作成の結果には影響しない。
            form.reset();
            showView("account");
            renderAccount();
            scheduleVerificationAfterSignup(credential.user);
          })
          .catch(showAuthError)
          .finally(function () {
            setBusy(form, false);
          });
      }

      function handleLogin(event) {
        event.preventDefault();
        if (busy) {
          return;
        }
        clearMessage();
        const form = event.currentTarget;
        const email = readEmail("loginEmail");
        const password = document.getElementById("loginPassword").value;
        const emailError = validateEmail(email);
        if (emailError) {
          return showMessage(emailError, "error");
        }
        if (password === "") {
          return showMessage("store_account_err_password_required", "error");
        }
        setBusy(form, true);
        storeAuth.signInWithEmailAndPassword(email, password)
          .then(function () {
            form.reset();
            showView("account");
            renderAccount();
            confirmStatusWithServer();
          })
          .catch(showAuthError)
          .finally(function () {
            setBusy(form, false);
          });
      }

      function handleReset(event) {
        event.preventDefault();
        if (busy) {
          return;
        }
        clearMessage();
        const form = event.currentTarget;
        const email = readEmail("resetEmail");
        const emailError = validateEmail(email);
        if (emailError) {
          return showMessage(emailError, "error");
        }
        setBusy(form, true);
        storeAuth.sendPasswordResetEmail(email)
          .then(function () {
            showMessage("store_account_reset_sent", "success");
          })
          .catch(function (error) {
            const code = error && error.code;
            // 未登録メールでも「登録されている場合は送りました」と同じ表示にする
            // (登録有無を画面から判別できないようにする)。
            if (code === "auth/user-not-found") {
              return showMessage("store_account_reset_sent", "success");
            }
            showAuthError(error);
          })
          .finally(function () {
            setBusy(form, false);
          });
      }

      function handleResend() {
        const user = storeAuth.currentUser;
        if (!user || user.emailVerified || verificationSendPending || verificationSending) {
          return;
        }
        if (getVerificationCooldownRemaining() > 0) {
          // ボタンは無効化済み。念のため、送信要求は出さずに案内だけ出す。
          updateResendButton();
          return showMessage("store_account_resend_wait", "info");
        }
        clearMessage();
        sendVerificationEmail(user)
          .then(function () {
            showMessage("store_account_verify_sent", "success");
          })
          .catch(showVerificationSendError);
      }

      // メール内のリンクで確認した後、最新の状態をFirebaseから取り直す。
      // IDトークンも更新し、サーバーがemail_verifiedを正しく判定できるようにする。
      function handleRefresh() {
        const user = storeAuth.currentUser;
        if (busy || !user) {
          return;
        }
        clearMessage();
        const box = document.getElementById("accountView");
        setBusy(box, true);
        user.reload()
          .then(function () {
            return storeAuth.currentUser.getIdToken(true);
          })
          .then(function () {
            renderAccount();
            showMessage(storeAuth.currentUser.emailVerified ? "store_account_verified_now" : "store_account_still_unverified", storeAuth.currentUser.emailVerified ? "success" : "info");
            return confirmStatusWithServer();
          })
          .catch(showAuthError)
          .finally(function () {
            setBusy(box, false);
          });
      }

      function handleLogout() {
        if (busy) {
          return;
        }
        cancelScheduledVerification();
        resetStoreState();
        const box = document.getElementById("accountView");
        setBusy(box, true);
        storeAuth.signOut()
          .then(function () {
            showView("login");
            showMessage("store_account_logged_out", "success");
          })
          .catch(showAuthError)
          .finally(function () {
            setBusy(box, false);
          });
      }

      // サーバー側(IDトークンをverifyIdToken)でもメール確認状態を確認する。
      // サーバーの判定がtrueの時だけ「確認済み」と表示を揃える(表示上の確認のみで、
      // 権限は何も付与されない)。失敗しても画面の利用は続けられる。
      function confirmStatusWithServer() {
        const user = storeAuth.currentUser;
        if (!user) {
          return Promise.resolve();
        }
        return user.getIdToken()
          .then(function (idToken) {
            return fetch("/api/moderate-submission", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + idToken
              },
              body: JSON.stringify({ mode: "storeUserStatus" })
            });
          })
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (result) {
            if (result && result.success === true && result.emailVerified !== true && storeAuth.currentUser) {
              const verifiedElement = document.getElementById("accountVerified");
              verifiedElement.textContent = t("store_account_status_unverified");
              verifiedElement.className = "status-value pending";
              document.getElementById("unverifiedBox").hidden = false;
            }
          })
          .catch(function () {
            // 表示確認のための呼び出しのため、失敗時は何もしない。
          });
      }

      function initialViewFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const view = params.get("view");
        return view === "signup" || view === "reset" ? view : "login";
      }

      function bindEvents() {
        document.getElementById("loginForm").addEventListener("submit", handleLogin);
        document.getElementById("signupForm").addEventListener("submit", handleSignup);
        document.getElementById("resetForm").addEventListener("submit", handleReset);
        document.getElementById("resendButton").addEventListener("click", handleResend);
        document.getElementById("refreshButton").addEventListener("click", handleRefresh);
        document.getElementById("logoutButton").addEventListener("click", handleLogout);
        document.getElementById("openStoreFormButton").addEventListener("click", openStoreForm);
        document.getElementById("storeFormCancelButton").addEventListener("click", function () {
          clearStoreMessage();
          closeStoreForm();
        });
        document.getElementById("storePreviewButton").addEventListener("click", handleStorePreview);
        document.getElementById("storeForm").addEventListener("submit", handleStoreRegister);
        // 住所欄でEnterを押したら、登録ではなく所在地の確認を行う
        // (登録ボタンは確認前は無効のため、ブラウザ標準の送信は起きない)。
        document.getElementById("storeAddressInput").addEventListener("keydown", function (event) {
          if (event.key === "Enter" && !event.isComposing) {
            event.preventDefault();
            const values = readStoreForm();
            if (storePreviewKey !== values.countryCode + "|" + values.address) {
              handleStorePreview();
            }
          }
        });
        ["storeCountrySelect", "storeAddressInput"].forEach(function (id) {
          document.getElementById(id).addEventListener("input", invalidateStorePreview);
          document.getElementById(id).addEventListener("change", invalidateStorePreview);
        });

        document.querySelectorAll("[data-go-view]").forEach(function (button) {
          button.addEventListener("click", function () {
            clearMessage();
            showView(button.getAttribute("data-go-view"));
          });
        });

        document.querySelectorAll("[data-show-password]").forEach(function (checkbox) {
          checkbox.addEventListener("change", function () {
            checkbox.getAttribute("data-show-password").split(" ").forEach(function (id) {
              document.getElementById(id).type = checkbox.checked ? "text" : "password";
            });
          });
        });

        document.querySelectorAll("[data-language]").forEach(function (button) {
          button.addEventListener("click", function () {
            currentLanguage = button.getAttribute("data-language");
            try {
              localStorage.setItem(LANGUAGE_STORAGE_KEY, currentLanguage);
            } catch (error) {
              // localStorageが使えなくても表示切替は続ける。
            }
            applyLanguage();
          });
        });
      }

      function init() {
        bindEvents();
        applyLanguage();

        try {
          const defaultApp = window.machinauFirebaseApp || firebase.app();
          const storeApp = firebase.apps.find(function (app) {
            return app.name === STORE_AUTH_APP_NAME;
          }) || firebase.initializeApp(defaultApp.options, STORE_AUTH_APP_NAME);
          storeAuth = storeApp.auth();
          storeAuth.languageCode = currentLanguage;
        } catch (error) {
          showView("login");
          showMessage("store_account_err_unavailable", "error");
          document.querySelectorAll("form button").forEach(function (button) {
            button.disabled = true;
          });
          return;
        }

        let firstState = true;
        storeAuth.onAuthStateChanged(function (user) {
          if (user && user.isAnonymous) {
            // このapp(店舗アカウント専用)で匿名ユーザーは使わない。
            storeAuth.signOut();
            return;
          }
          if (user) {
            if (currentView !== "account") {
              showView("account");
            }
            renderAccount();
            if (firstState) {
              confirmStatusWithServer();
            }
          } else if (currentView === "account" || firstState) {
            cancelScheduledVerification();
            resetStoreState();
            showView(firstState ? initialViewFromUrl() : "login");
          }
          firstState = false;
        });
      }

      init();
    })();
  </script>
</body>
</html>
