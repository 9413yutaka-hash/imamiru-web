<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex, nofollow">

  <title>
    店舗専用投稿URL管理｜マチナウ運営
  </title>

  <style>
    :root {
      --navy: #071a33;
      --blue: #0788c9;
      --sky: #dff7ff;
      --green: #19a96b;
      --red: #ef5a67;
      --white: #ffffff;
      --text: #15233a;
      --subtext: #697386;
      --border: #e2eaf1;
      --background: #f4f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      background: var(--navy);
      color: var(--white);
      padding: 18px 20px;
    }

    header .page-label {
      font-size: 12px;
      opacity: 0.8;
    }

    header h1 {
      margin: 4px 0 0;
      font-size: 20px;
    }

    header a {
      display: inline-block;
      margin-top: 10px;
      color: var(--sky);
      font-size: 13px;
      text-decoration: none;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .panel {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field input[type="text"],
    .field input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
    }

    .primary-button {
      background: linear-gradient(135deg, var(--blue), #04b7d7);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary-button {
      background: var(--white);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .danger-button {
      background: var(--white);
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .message-box {
      font-size: 13px;
      margin-top: 10px;
      min-height: 1em;
    }

    .message-box.error {
      color: var(--red);
    }

    .message-box.success {
      color: var(--green);
    }

    #adminArea {
      display: none;
    }

    #adminArea.visible {
      display: block;
    }

    .store-row {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .store-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .store-name {
      font-weight: 900;
      font-size: 14px;
    }

    .status-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .status-badge.enabled {
      background: #e3f7ee;
      color: var(--green);
    }

    .status-badge.disabled {
      background: #f1f2f5;
      color: var(--subtext);
    }

    .store-row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .issued-url-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--sky);
      border-radius: 10px;
      font-size: 12px;
      word-break: break-all;
    }

    .issued-url-box strong {
      display: block;
      margin-bottom: 4px;
      color: var(--navy);
      font-size: 12px;
    }

    .empty-state {
      color: var(--subtext);
      font-size: 13px;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="page-label">
      マチナウ運営
    </div>

    <h1>
      店舗専用投稿URL管理
    </h1>

    <a href="admin.html">
      ← 管理トップへ戻る
    </a>
  </header>

  <main>

    <section id="loginPanel" class="panel">
      <h2>
        管理者ログイン
      </h2>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="adminEmail">
            メールアドレス
          </label>

          <input
            id="adminEmail"
            type="text"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="adminPassword">
            パスワード
          </label>

          <input
            id="adminPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button id="loginButton" class="primary-button" type="submit">
          管理画面へログイン
        </button>
      </form>

      <div id="loginMessage" class="message-box" role="status" aria-live="polite"></div>
    </section>

    <section id="adminArea">

      <!-- 店舗専用投稿URL Phase2(1店舗MVP)｜過剰な店舗管理システムには
           しない(本部指示)。店舗名入力・登録・専用URL発行・一覧・
           有効/無効切替・token再発行のみの最小構成。 -->
      <div class="panel">
        <h2>
          新規店舗登録
        </h2>

        <form id="createStoreForm" novalidate>
          <div class="field">
            <label for="newStoreNameInput">
              店舗名(正式名称)
            </label>

            <input
              id="newStoreNameInput"
              type="text"
              maxlength="50"
              required
            >
          </div>

          <button id="createStoreButton" class="primary-button" type="submit">
            店舗を登録して専用URLを発行する
          </button>
        </form>

        <div id="createStoreMessage" class="message-box" role="status" aria-live="polite"></div>

        <div id="createStoreIssuedUrlBox" class="issued-url-box" style="display:none;">
          <strong>
            この専用URLは今だけ表示されます。必ずコピーして店舗へお渡しください。
          </strong>

          <div id="createStoreIssuedUrlText"></div>

          <button
            id="createStoreCopyButton"
            type="button"
            class="secondary-button"
            style="margin-top:8px;"
          >
            URLをコピー
          </button>
        </div>
      </div>

      <div class="panel">
        <h2>
          登録済み店舗一覧
        </h2>

        <!-- 店舗管理Phase3 STEP1｜既存の一覧取得(adminListStoreAccounts)は
             変更せず、取得済みデータへのクライアント側フィルタとして検索を
             追加する(新規APIモード・新規Firestore検索は不要、本部指示)。 -->
        <div class="field">
          <label for="storeSearchInput">
            店舗名 / storeIdで検索
          </label>

          <input
            id="storeSearchInput"
            type="text"
            placeholder="例：マチナウ　/　storeIdの一部"
          >
        </div>

        <div id="storeListMessage" class="message-box" role="status" aria-live="polite"></div>

        <div id="storeList"></div>
      </div>

    </section>

  </main>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    const ADMIN_EMAIL =
      "9413yutaka@gmail.com";

    function escapeHtmlText(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // admin-column.htmlのcallColumnApi(mode, payload)と全く同じ構成
    // (既存の管理画面API呼び出しパターンをそのまま踏襲、複製しない
    // ロジックはFunction側のmodeハンドラに集約されている)。
    async function getAdminIdToken() {
      const currentUser = firebase.auth().currentUser;

      if (!currentUser) {
        throw new Error(
          "ログイン状態を確認できませんでした。再度ログインしてください。"
        );
      }

      return currentUser.getIdToken();
    }

    async function callShopsApi(mode, payload) {
      const idToken = await getAdminIdToken();

      const response = await fetch("/api/moderate-submission", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + idToken
        },
        body: JSON.stringify(Object.assign({ mode: mode }, payload || {}))
      });

      let responseData = null;

      try {
        responseData = await response.json();
      } catch (jsonError) {
        throw new Error("応答を読み取れませんでした。");
      }

      if (!response.ok || !responseData || responseData.success !== true) {
        throw new Error(
          (responseData && responseData.message) || "処理に失敗しました。"
        );
      }

      return responseData;
    }

    const loginPanel = document.getElementById("loginPanel");
    const adminArea = document.getElementById("adminArea");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginMessage = document.getElementById("loginMessage");

    const createStoreForm = document.getElementById("createStoreForm");
    const createStoreButton = document.getElementById("createStoreButton");
    const newStoreNameInput = document.getElementById("newStoreNameInput");
    const createStoreMessage = document.getElementById("createStoreMessage");
    const createStoreIssuedUrlBox = document.getElementById("createStoreIssuedUrlBox");
    const createStoreIssuedUrlText = document.getElementById("createStoreIssuedUrlText");
    const createStoreCopyButton = document.getElementById("createStoreCopyButton");

    const storeSearchInput = document.getElementById("storeSearchInput");
    const storeListMessage = document.getElementById("storeListMessage");
    const storeList = document.getElementById("storeList");

    function showLoginMessage(text, type) {
      loginMessage.textContent = text;
      loginMessage.className = "message-box" + (type ? " " + type : "");
    }

    function clearLoginMessage() {
      loginMessage.textContent = "";
      loginMessage.className = "message-box";
    }

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = "message-box" + (type ? " " + type : "");
    }

    // storeId + 生tokenから専用URLを組み立てる。post.html側の
    // requestedStoreIdFromUrl/requestedStoreTokenFromUrlの読み取り方
    // (mode=shop&store={storeId}&token={rawToken})とそのまま対応する。
    function buildStoreSubmissionUrl(storeId, token) {
      return (
        "https://machinau.jp/post.html?mode=shop&store=" +
        encodeURIComponent(storeId) +
        "&token=" +
        encodeURIComponent(token)
      );
    }

    let lastCreatedStoreUrl = "";

    createStoreForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      showMessage(createStoreMessage, "", "");
      createStoreIssuedUrlBox.style.display = "none";

      const storeName = newStoreNameInput.value.trim();

      if (storeName === "") {
        showMessage(createStoreMessage, "店舗名を入力してください。", "error");
        return;
      }

      createStoreButton.disabled = true;
      createStoreButton.textContent = "登録しています…";

      try {
        const responseData = await callShopsApi("adminCreateStoreAccount", {
          storeName: storeName
        });

        const issuedUrl = buildStoreSubmissionUrl(
          responseData.storeId,
          responseData.token
        );

        lastCreatedStoreUrl = issuedUrl;

        createStoreIssuedUrlText.textContent = issuedUrl;
        createStoreIssuedUrlBox.style.display = "";

        newStoreNameInput.value = "";

        showMessage(createStoreMessage, "店舗を登録しました。", "success");

        await loadStoreAccounts();
      } catch (error) {
        console.error("店舗登録に失敗しました：", error);
        showMessage(createStoreMessage, error.message || "登録に失敗しました。", "error");
      } finally {
        createStoreButton.disabled = false;
        createStoreButton.textContent = "店舗を登録して専用URLを発行する";
      }
    });

    createStoreCopyButton.addEventListener("click", async function() {
      if (!lastCreatedStoreUrl) {
        return;
      }

      try {
        await navigator.clipboard.writeText(lastCreatedStoreUrl);

        const originalText = createStoreCopyButton.textContent;
        createStoreCopyButton.textContent = "コピーしました";

        window.setTimeout(function() {
          createStoreCopyButton.textContent = originalText;
        }, 1500);
      } catch (error) {
        console.error("URLのコピーに失敗しました：", error);
      }
    });

    // 店舗管理Phase3 STEP1｜adminListStoreAccountsで取得した全店舗を保持し、
    // 検索欄の入力のたびにこのキャッシュへクライアント側フィルタ・並べ替えを
    // かけて再描画する(再取得・新規APIモードは不要)。
    let allStoreAccounts = [];

    // 有効店舗を先に、同じ状態の中は正式店舗名で安定して並べる。
    // localeCompare("ja")は既存ブラウザで安全に使える日本語比較方法。
    function compareStoreAccountsForDisplay(a, b) {
      if (a.enabled !== b.enabled) {
        return a.enabled ? -1 : 1;
      }

      return String(a.storeName || "").localeCompare(
        String(b.storeName || ""),
        "ja"
      );
    }

    // 正式店舗名・storeIdへの部分一致(大文字小文字を区別しない)。
    function filterStoreAccountsByQuery(storeAccounts, query) {
      const normalizedQuery = String(query || "").trim().toLowerCase();

      if (normalizedQuery === "") {
        return storeAccounts;
      }

      return storeAccounts.filter(function(storeAccount) {
        const storeName = String(storeAccount.storeName || "").toLowerCase();
        const storeId = String(storeAccount.storeId || "").toLowerCase();

        return (
          storeName.indexOf(normalizedQuery) !== -1 ||
          storeId.indexOf(normalizedQuery) !== -1
        );
      });
    }

    // 店舗管理Phase3 STEP3｜TOPの既存掲載判定(handlePublicSubmissionsListRequest、
    // status==="approved" かつ expiresAt > 現在時刻)をサーバー側で計算した
    // isCurrentlyLiveをそのまま使う。ここで新しい独自ルールは作らない。
    function getStoreSubmissionStatusLabel(submission) {
      if (submission.status === "approved") {
        return submission.isCurrentlyLive ? "掲載中" : "終了(期限切れ)";
      }

      if (submission.status === "pending") {
        return "審査待ち";
      }

      if (submission.status === "rejected") {
        return "却下";
      }

      if (submission.status === "expired") {
        return "終了";
      }

      // 実コード上、上記4値以外のstatusが存在した場合の安全なフォールバック。
      return "不明(" + (submission.status || "未設定") + ")";
    }

    function getStoreSubmissionStatusBadgeClass(submission) {
      if (submission.status === "approved" && submission.isCurrentlyLive) {
        return "enabled";
      }

      if (submission.status === "pending") {
        return "";
      }

      return "disabled";
    }

    function formatStoreSubmissionDateTime(millis) {
      if (!millis) {
        return "-";
      }

      try {
        return new Date(millis).toLocaleString("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch (error) {
        return "-";
      }
    }

    function buildStoreSubmissionHistoryItemHtml(submission) {
      const statusLabel = getStoreSubmissionStatusLabel(submission);
      const statusBadgeClass = getStoreSubmissionStatusBadgeClass(submission);
      const content = typeof submission.content === "string" ? submission.content : "";
      const contentPreview = content.length > 80 ? content.slice(0, 80) + "…" : content;

      const metaParts = [
        "投稿日時：" + formatStoreSubmissionDateTime(submission.createdAtMillis)
      ];

      if (submission.expiresAtMillis) {
        metaParts.push("掲載期限：" + formatStoreSubmissionDateTime(submission.expiresAtMillis));
      }

      if (submission.publicationNumber) {
        metaParts.push("掲載番号：" + submission.publicationNumber);
      }

      return (
        '<div class="store-history-item" style="padding:8px 0; border-top:1px solid var(--border);">' +
          '<div class="store-row-top">' +
            '<span class="store-name" style="font-size:13px;">' + escapeHtmlText(submission.title || "(無題)") + '</span>' +
            '<span class="status-badge ' + statusBadgeClass + '">' + escapeHtmlText(statusLabel) + '</span>' +
          '</div>' +
          '<div style="font-size:12px; color:var(--subtext); margin-top:4px;">' +
            escapeHtmlText(metaParts.join("　/　")) +
          '</div>' +
          '<p style="margin:6px 0 0; font-size:13px;">' + escapeHtmlText(contentPreview) + '</p>' +
        '</div>'
      );
    }

    async function loadStoreSubmissionHistory(storeId, historyBox) {
      const messageEl = historyBox.querySelector(".store-history-message");
      const listEl = historyBox.querySelector(".store-history-list");

      messageEl.textContent = "読み込んでいます…";
      listEl.innerHTML = "";

      try {
        const responseData = await callShopsApi("adminListStoreSubmissions", {
          storeId: storeId
        });

        const submissions = Array.isArray(responseData.submissions)
          ? responseData.submissions
          : [];

        if (submissions.length === 0) {
          messageEl.textContent = "この店舗からの投稿はまだありません。";
          return;
        }

        messageEl.textContent = "";
        listEl.innerHTML = submissions.map(buildStoreSubmissionHistoryItemHtml).join("");
      } catch (error) {
        console.error("投稿履歴の取得に失敗しました：", error);
        messageEl.textContent = error.message || "投稿履歴を取得できませんでした。";
      }
    }

    // 正式店舗参加基盤 Phase 2A｜セルフ登録店舗の状態・運営確認理由の表示名。
    const SELF_REGISTRATION_STATUS_LABELS = {
      active: "利用可能",
      pending_review: "運営確認待ち",
      rejected: "却下済み",
      suspended: "停止中"
    };

    const SELF_REGISTRATION_FLAG_LABELS = {
      possible_duplicate: "既存店舗と同じ名前・100m以内",
      rapid_registrations: "24時間以内の連続登録"
    };

    function renderStoreAccounts(storeAccounts, hasAnyStores) {
      if (!Array.isArray(storeAccounts) || storeAccounts.length === 0) {
        storeList.innerHTML = hasAnyStores
          ? '<p class="empty-state">該当する店舗がありません。</p>'
          : '<p class="empty-state">登録済みの店舗はまだありません。</p>';
        return;
      }

      storeList.innerHTML = storeAccounts
        .map(function(storeAccount) {
          const statusClass = storeAccount.enabled ? "enabled" : "disabled";
          const statusLabel = storeAccount.enabled ? "有効" : "無効";
          const toggleLabel = storeAccount.enabled ? "無効化する" : "有効化する";
          // 正式店舗参加基盤 Phase 2A｜店舗自身がアカウントから登録した店舗。
          // tokenは発行しない(専用URL再発行なし)。所在地は店舗が選んだ国で確定済みのため
          // 日本固定の運営用所在地登録も出さない。運営確認待ちだけ承認・却下を出す。
          const isSelfRegistered = storeAccount.createdByType === "storeUser";
          const registrationStatus = storeAccount.registrationStatus || "active";

          return (
            '<div class="store-row" data-store-id="' +
            escapeHtmlText(storeAccount.storeId) +
            '">' +
              '<div class="store-row-top">' +
                '<span class="store-name">' + escapeHtmlText(storeAccount.storeName) + '</span>' +
                '<span class="status-badge ' + statusClass + '">' + statusLabel + '</span>' +
              '</div>' +
              // 今だけ投稿 STEP 4A｜運営が登録した正式所在地(今だけ投稿の15km・都道府県全体に使う)。
              '<div class="store-location-line" style="margin:6px 0 0; font-size:12.5px; color:var(--subtext);">' +
                '所在地：' + (storeAccount.location
                  ? escapeHtmlText([storeAccount.location.prefecture, storeAccount.location.city].filter(Boolean).join(' ') + '（' + storeAccount.location.address + '）')
                  : '<strong style="color:#a93d3d;">未登録（今だけ投稿は使えません）</strong>') +
              '</div>' +
              (isSelfRegistered
                ? '<div class="store-self-line" style="margin:4px 0 0; font-size:12.5px; color:var(--subtext);">' +
                    '<strong>店舗が自分で登録</strong>（専用URLなし）｜状態：' +
                    escapeHtmlText(SELF_REGISTRATION_STATUS_LABELS[registrationStatus] || registrationStatus) +
                    ((storeAccount.reviewFlags || []).length > 0
                      ? '｜確認理由：' + escapeHtmlText(storeAccount.reviewFlags.map(function(flag) {
                          return SELF_REGISTRATION_FLAG_LABELS[flag] || flag;
                        }).join('、'))
                      : '') +
                  '</div>'
                : '') +
              '<div class="store-row-actions">' +
                (isSelfRegistered && registrationStatus === "pending_review"
                  ? '<button type="button" class="primary-button" data-action="review-approve">確認OK（利用可能にする）</button>' +
                    '<button type="button" class="danger-button" data-action="review-reject">登録を却下する</button>'
                  : '') +
                (isSelfRegistered ? '' : '<button type="button" class="secondary-button" data-action="rotate">token再発行</button>') +
                '<button type="button" class="secondary-button" data-action="rename">店舗名を編集</button>' +
                '<button type="button" class="secondary-button" data-action="history">投稿履歴を見る</button>' +
                (isSelfRegistered ? '' : '<button type="button" class="secondary-button" data-action="location">所在地を登録・変更</button>') +
                '<button type="button" class="' + (storeAccount.enabled ? "danger-button" : "secondary-button") + '" data-action="toggle">' + toggleLabel + '</button>' +
              '</div>' +
              '<div class="issued-url-box store-rename-box" style="display:none;">' +
                '<div class="field" style="margin-bottom:0;">' +
                  '<label>新しい正式店舗名</label>' +
                  '<input type="text" class="store-rename-input" maxlength="50" value="' + escapeHtmlText(storeAccount.storeName) + '">' +
                '</div>' +
                '<div class="store-row-actions" style="margin-top:8px;">' +
                  '<button type="button" class="primary-button" data-action="rename-save">保存</button>' +
                  '<button type="button" class="secondary-button" data-action="rename-cancel">キャンセル</button>' +
                '</div>' +
                '<p style="margin:8px 0 0; font-size:12px; color:var(--subtext);">店舗名の変更は今後の新規投稿に反映されます。過去の投稿名は変更されません。</p>' +
              '</div>' +
              '<div class="issued-url-box store-location-box" style="display:none;">' +
                '<div class="field" style="margin-bottom:0;">' +
                  '<label>店舗の住所（今だけ投稿の掲載場所になります）</label>' +
                  '<input type="text" class="store-location-input" maxlength="120" placeholder="例：沖縄県那覇市久米2丁目29-19" value="' + escapeHtmlText(storeAccount.location ? storeAccount.location.address : '') + '">' +
                '</div>' +
                '<div class="store-row-actions" style="margin-top:8px;">' +
                  '<button type="button" class="secondary-button" data-action="location-preview">位置を確認</button>' +
                  '<button type="button" class="primary-button" data-action="location-save" style="display:none;">この所在地で登録</button>' +
                  '<button type="button" class="secondary-button" data-action="location-cancel">閉じる</button>' +
                '</div>' +
                '<div class="store-location-preview" style="margin-top:8px; font-size:13px; line-height:1.7;"></div>' +
                '<p style="margin:8px 0 0; font-size:12px; color:var(--subtext);">「位置を確認」で地図上の場所を確かめてから登録してください。登録後の新しい今だけ投稿から反映されます（過去の投稿は変わりません）。</p>' +
              '</div>' +
              '<div class="issued-url-box store-issued-url" style="display:none;">' +
                '<strong>この専用URLは今だけ表示されます。必ずコピーして店舗へお渡しください。</strong>' +
                '<div class="store-issued-url-text"></div>' +
              '</div>' +
              '<div class="issued-url-box store-history-box" style="display:none;">' +
                '<div class="store-history-message"></div>' +
                '<div class="store-history-list"></div>' +
              '</div>' +
            '</div>'
          );
        })
        .join("");
    }

    // 現在の検索欄の値でallStoreAccountsを絞り込み、再描画する。
    function renderStoreListForCurrentSearch() {
      const filteredStoreAccounts = filterStoreAccountsByQuery(
        allStoreAccounts,
        storeSearchInput ? storeSearchInput.value : ""
      );

      renderStoreAccounts(filteredStoreAccounts, allStoreAccounts.length > 0);
    }

    async function loadStoreAccounts() {
      showMessage(storeListMessage, "読み込んでいます…", "");

      try {
        const responseData = await callShopsApi("adminListStoreAccounts", {});

        allStoreAccounts = Array.isArray(responseData.storeAccounts)
          ? responseData.storeAccounts.slice().sort(compareStoreAccountsForDisplay)
          : [];

        renderStoreListForCurrentSearch();
        showMessage(storeListMessage, "", "");
      } catch (error) {
        console.error("店舗一覧の取得に失敗しました：", error);
        showMessage(storeListMessage, error.message || "店舗一覧を取得できませんでした。", "error");
      }
    }

    if (storeSearchInput) {
      storeSearchInput.addEventListener("input", function() {
        renderStoreListForCurrentSearch();
      });
    }

    storeList.addEventListener("click", async function(event) {
      const actionButton = event.target.closest("button[data-action]");

      if (!actionButton) {
        return;
      }

      const storeRow = actionButton.closest(".store-row");

      if (!storeRow) {
        return;
      }

      const storeId = storeRow.getAttribute("data-store-id");
      const action = actionButton.getAttribute("data-action");

      actionButton.disabled = true;

      try {
        if (action === "review-approve" || action === "review-reject") {
          const approve = action === "review-approve";

          if (!window.confirm(approve
            ? "この店舗の登録を確認OKにして、利用可能にしますか？"
            : "この店舗の登録を却下しますか？（店舗は利用できなくなります）")) {
            return;
          }

          await callShopsApi("adminStoreRegistrationReview", {
            storeId: storeId,
            decision: approve ? "approve" : "reject"
          });

          await loadStoreAccounts();
        } else if (action === "rotate") {
          const responseData = await callShopsApi("adminRotateStoreToken", {
            storeId: storeId
          });

          const issuedUrl = buildStoreSubmissionUrl(
            responseData.storeId,
            responseData.token
          );

          const issuedUrlBox = storeRow.querySelector(".store-issued-url");
          const issuedUrlText = storeRow.querySelector(".store-issued-url-text");

          if (issuedUrlBox && issuedUrlText) {
            issuedUrlText.textContent = issuedUrl;
            issuedUrlBox.style.display = "";
          }
        } else if (action === "toggle") {
          const isCurrentlyEnabled =
            storeRow.querySelector(".status-badge").classList.contains("enabled");

          await callShopsApi("adminSetStoreEnabled", {
            storeId: storeId,
            enabled: !isCurrentlyEnabled
          });

          await loadStoreAccounts();
        } else if (action === "rename") {
          const renameBox = storeRow.querySelector(".store-rename-box");
          const renameInput = storeRow.querySelector(".store-rename-input");

          if (renameBox) {
            renameBox.style.display = "";
          }

          if (renameInput) {
            renameInput.focus();
          }
        } else if (action === "rename-cancel") {
          const renameBox = storeRow.querySelector(".store-rename-box");
          const renameInput = storeRow.querySelector(".store-rename-input");
          const currentStoreName = storeRow.querySelector(".store-name");

          if (renameInput && currentStoreName) {
            renameInput.value = currentStoreName.textContent;
          }

          if (renameBox) {
            renameBox.style.display = "none";
          }
        } else if (action === "history") {
          const historyBox = storeRow.querySelector(".store-history-box");

          if (!historyBox) {
            return;
          }

          if (historyBox.style.display === "none") {
            historyBox.style.display = "";
            actionButton.textContent = "投稿履歴を閉じる";
            await loadStoreSubmissionHistory(storeId, historyBox);
          } else {
            historyBox.style.display = "none";
            actionButton.textContent = "投稿履歴を見る";
          }
        } else if (action === "location") {
          const locationBox = storeRow.querySelector(".store-location-box");

          if (locationBox) {
            locationBox.style.display = locationBox.style.display === "none" ? "" : "none";
          }
        } else if (action === "location-cancel") {
          const locationBox = storeRow.querySelector(".store-location-box");

          if (locationBox) {
            locationBox.style.display = "none";
          }
        } else if (action === "location-preview" || action === "location-save") {
          // 今だけ投稿 STEP 4A｜住所をサーバーでGoogle Geocodingし、確認してから保存する。
          const locationInput = storeRow.querySelector(".store-location-input");
          const preview = storeRow.querySelector(".store-location-preview");
          const saveButton = storeRow.querySelector('button[data-action="location-save"]');
          const address = locationInput ? locationInput.value.trim() : "";

          if (address === "") {
            showMessage(storeListMessage, "住所を入力してください。", "error");
            return;
          }

          const isSave = action === "location-save";

          const responseData = await callShopsApi("imadakeAdminStoreLocation", {
            storeId: storeId,
            address: address,
            confirm: isSave
          });

          const location = responseData.location || {};

          if (preview) {
            const mapUrl =
              "https://www.google.com/maps/search/?api=1&query=" +
              encodeURIComponent(location.latitude + "," + location.longitude);

            preview.innerHTML =
              "<div>確認結果：" + escapeHtmlText(location.formattedAddress || "") + "</div>" +
              "<div>都道府県・市区町村：" + escapeHtmlText([location.prefecture, location.city].filter(Boolean).join(" ")) +
                "（地域キー：" + escapeHtmlText(location.regionKey || "なし") + "）</div>" +
              (location.partialMatch
                ? "<div style='color:#a93d3d;'>※住所の一部だけが一致しました。地図で場所を必ず確認してください。</div>"
                : "") +
              "<div><a href='" + escapeHtmlText(mapUrl) + "' target='_blank' rel='noopener noreferrer'>🗺️ 地図で場所を確認する</a></div>";
          }

          if (isSave) {
            await loadStoreAccounts();
            showMessage(storeListMessage, "所在地を登録しました。", "success");
          } else if (saveButton) {
            saveButton.style.display = "";
          }
        } else if (action === "rename-save") {
          const renameInput = storeRow.querySelector(".store-rename-input");
          const newStoreName = renameInput ? renameInput.value.trim() : "";

          if (newStoreName === "") {
            showMessage(storeListMessage, "店舗名を入力してください。", "error");
            return;
          }

          await callShopsApi("adminUpdateStoreAccountName", {
            storeId: storeId,
            storeName: newStoreName
          });

          await loadStoreAccounts();

          showMessage(storeListMessage, "店舗名を更新しました。", "success");
        }
      } catch (error) {
        console.error("店舗操作に失敗しました：", error);
        showMessage(storeListMessage, error.message || "操作に失敗しました。", "error");
      } finally {
        actionButton.disabled = false;
      }
    });

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      clearLoginMessage();

      const email = document.getElementById("adminEmail").value.trim().toLowerCase();
      const password = document.getElementById("adminPassword").value;

      if (email !== ADMIN_EMAIL.toLowerCase()) {
        showLoginMessage("このメールアドレスには管理者権限がありません。", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "ログインしています…";

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);
      } catch (error) {
        console.error("❌ 管理者ログインに失敗しました", error);
        showLoginMessage("ログインできませんでした。メールアドレスとパスワードを確認してください。", "error");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "管理画面へログイン";
      }
    });

    // admin.htmlの管理者判定と同一パターン。Firebase Anonymous Authの
    // ユーザーはemailを持たないため、この判定で自動的に非管理者として
    // 扱われる(request.auth != null だけでは判定しない)。
    firebase.auth().onAuthStateChanged(async function(user) {
      clearLoginMessage();

      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        loginPanel.style.display = "none";
        adminArea.classList.add("visible");

        await loadStoreAccounts();
        return;
      }

      if (user) {
        try {
          await firebase.auth().signOut();
        } catch (error) {
          console.error("管理者以外のユーザーをログアウトできませんでした", error);
        }

        showLoginMessage("このアカウントには管理者権限がありません。", "error");
      }

      loginPanel.style.display = "block";
      adminArea.classList.remove("visible");
    });
  </script>

</body>
</html>
