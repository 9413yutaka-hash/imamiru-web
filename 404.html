<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0788c9"
  >

  <title>
    ページが見つかりません / Page not found｜マチナウ
  </title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="favicon.svg"
  >

  <style>
    :root {
      --navy: #071a33;
      --blue: #0788c9;
      --cyan: #04b7d7;
      --white: #ffffff;
      --text: #15233a;
      --subtext: #697386;
      --background: #f4f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
      background: var(--background);
      color: var(--text);
      text-align: center;
    }

    .card {
      max-width: 420px;
      width: 100%;
      padding: 36px 28px;
      border-radius: 22px;
      background: var(--white);
      box-shadow: 0 16px 45px rgba(20, 52, 82, 0.12);
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      font-size: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      color: var(--navy);
    }

    p {
      margin: 0 0 6px;
      font-size: 14px;
      color: var(--subtext);
      line-height: 1.6;
    }

    .en {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e7edf3;
    }

    a.home-link {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--blue);
      color: var(--white);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🌺</div>

    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>

    <div class="en">
      <h1>Page not found</h1>
      <p>The page you're looking for may have been moved or removed.</p>
    </div>

    <a class="home-link" href="/">マチナウTOPへ戻る / Back to Top</a>
  </div>

</body>
</html>
