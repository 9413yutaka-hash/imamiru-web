name: Store card plan (Production)

# STEP 52-B｜店舗カード月額100円の本番(machinau.jp)の定期実行の入口(mode storeCustomPlanCron)。
# 1回の呼び出しで、サーバーが日本時間で判断して次を行う：前の月の月末締め(翌月1日 0:00 JST 以降)・
# 翌月2日 0:00 JST 以降の請求・3日後と7日後の再請求・14日での公開停止・清算の済んだ退会の最終削除。
# 今だけ投稿の請求は呼ばない(このファイルは店舗カードの入口だけ)。
#
# 代表の「本番の定期請求」の承認まで停止している(2つの鍵)：
#   ①下の schedule の行をコメントにしている(予約の時刻が登録されない)
#   ②job の if: false(手動の「Run workflow」でも実行されない)
# 有効にする時は、①の「# - cron」の行の先頭の「# 」を外し、②の if: false を、その下のコメントの条件に置き換える。
# 有効にした後も、サーバー側のスイッチ(STORE_CUSTOM_PLAN_CLOSE_WRITES_ENABLED・STORE_CUSTOM_PLAN_CHARGE_ENABLED・
# STORE_CUSTOM_PLAN_CRON_CHARGES_ENABLED)が false の間は、サーバーが 403 cron_disabled を返し、締め・請求は行われない
# (この実行は「停止中」として成功で終わる)。
#
# 本番だけに送る(Preview の URL には送らない。Preview は main.yml の preview-plan-cron)。合言葉は、次の確認を
# すべて満たした時だけ送る：①この workflow のファイルが main のもの ②machinau.jp の接続先の確認(mode=firebaseTarget)が
# 本番の Firebase(chikashoku-app)・検査あり。合言葉はログに出さない。応答は要約だけを出す。
# 二重実行：同じ workflow の実行は concurrency で1つずつ。サーバー側にも実行ロック(409 already_running)と、
# 店舗・月ごとに1件の請求書・冪等キー・請求ロックがある(既存の STEP 44 の仕組み)。

on:
  # schedule:
  #   - cron: "10 * * * *"  # 毎時10分(UTC)。月末締め・2日の請求の判断はサーバーが日本時間で行う。
  workflow_dispatch:

concurrency:
  group: store-card-plan-production
  cancel-in-progress: false

jobs:
  production-plan-cron:
    # 代表承認まで停止。有効にする時の条件：github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Verify the workflow version and the Production connection
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_REF" in
            *"/.github/workflows/store-card-plan-production.yml@refs/heads/main") ;;
            *) echo "STOP: this run does not use the main workflow file"; exit 1 ;;
          esac
          target_json="$(curl -fsS --max-time 30 "https://machinau.jp/api/moderate-submission?mode=firebaseTarget")"
          if ! printf '%s' "$target_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=JSON.parse(s);process.exit(t&&t.success===true&&t.projectId==="chikashoku-app"&&t.enforced===true?0:1)})'; then
            echo "STOP: machinau.jp is not connected to the Production Firebase"; exit 1
          fi
          echo "Verified Production: https://machinau.jp (Firebase chikashoku-app)"

      - name: Run the store card scheduled entry on Production (close, charges, dunning)
        env:
          CRON_SECRET: ${{ secrets.AI_COLLECT_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "STOP: missing secret"; exit 1
          fi
          code="$(curl -sS -o response.json -w '%{http_code}' --max-time 60 -X POST "https://machinau.jp/api/moderate-submission" \
            -H "Content-Type: application/json" \
            -H "X-Machinau-Cron-Secret: $CRON_SECRET" \
            -d '{"mode":"storeCustomPlanCron"}')"
          echo "HTTP $code"
          reason="$(node -e 'try{const r=JSON.parse(require("fs").readFileSync("response.json","utf8"));process.stdout.write(typeof r.reason==="string"?r.reason:"")}catch(e){}')"
          node -e 'const r=JSON.parse(require("fs").readFileSync("response.json","utf8"));const s=r.steps||{};const c=s.charges||{};console.log(JSON.stringify({success:r.success,reason:r.reason,status:r.status,jstDate:r.jstDate,closeMonth:r.closeMonth,errors:r.errors,close:s.close,dunning:s.dunning,charges:{status:c.status,executed:c.executed,blockedReason:c.blockedReason,totals:c.totals},accountDeletion:s.accountDeletion?{status:s.accountDeletion.status,processed:s.accountDeletion.processed,deferred:s.accountDeletion.deferred,counts:s.accountDeletion.counts,operatorAttention:s.accountDeletion.operatorAttention}:undefined},null,2))' || echo "(response was not JSON)"
          rm -f response.json
          if [ "$code" = "403" ] && [ "$reason" = "cron_disabled" ]; then
            echo "Skipped: the Production store card switches are off (no close, no charge)"; exit 0
          fi
          [ "$code" = "200" ]
