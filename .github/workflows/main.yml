name: Expire Posts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  expire:
    runs-on: ubuntu-latest

    steps:
      - name: Call expire API
        run: |
          curl -L https://machinau.jp/api/expire \
            -H "X-Machinau-Cron-Secret: ${{ secrets.AI_COLLECT_CRON_SECRET }}"

  collect-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Collect IMPORTANT sources
        run: |
          curl -f --max-time 90 -X POST https://machinau.jp/api/admin-source-collect \
            -H "Content-Type: application/json" \
            -H "X-Machinau-Cron-Secret: ${{ secrets.AI_COLLECT_CRON_SECRET }}" \
            -d '{"priorityTier":"IMPORTANT"}'

      - name: Collect NORMAL sources
        run: |
          curl -f --max-time 90 -X POST https://machinau.jp/api/admin-source-collect \
            -H "Content-Type: application/json" \
            -H "X-Machinau-Cron-Secret: ${{ secrets.AI_COLLECT_CRON_SECRET }}" \
            -d '{"priorityTier":"NORMAL"}'
