<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0788c9"
  >

  <meta
    name="description"
    content="マチナウ読み物の一覧です。掲載年月とカテゴリーから、旅や街をもっと楽しむための読み物を探せます。"
  >

  <title>
    マチナウ読み物 一覧｜マチナウ
  </title>

  <link
    rel="canonical"
    href="https://machinau.jp/column-list.html"
  >

  <link
    rel="icon"
    type="image/png"
    href="/favicon.png?v=2"
  >

  <style>
    :root {
      --navy: #071a33;
      --blue: #0788c9;
      --cyan: #04b7d7;
      --white: #ffffff;
      --text: #15233a;
      --subtext: #697386;
      --border: #e7edf3;
      --background: #f4f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 60px;
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
      background: var(--background);
      color: var(--text);
    }

    .page-header {
      padding: 28px 18px;
      background: linear-gradient(135deg, #0788c9, #04b7d7);
      color: var(--white);
      text-align: center;
    }

    .brand-mini {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .brand-mini-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 15px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 20px;
    }

    main {
      width: min(100%, 720px);
      margin: -20px auto 0;
      padding: 0 18px;
    }

    .card {
      background: var(--white);
      border-radius: 22px;
      box-shadow: 0 16px 45px rgba(20, 52, 82, 0.12);
      padding: 22px;
      margin-bottom: 18px;
    }

    .filter-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .filter-form .field-full {
      grid-column: 1 / -1;
    }

    .filter-form label {
      display: block;
      margin: 0 0 5px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
    }

    .filter-form input,
    .filter-form select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
    }

    .filter-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .search-button {
      flex: 1;
      min-height: 44px;
      border: none;
      border-radius: 999px;
      color: var(--white);
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .reset-button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--white);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .article-card {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .article-card-image {
      /* 画像UX改善Phase2｜140pxはリストサムネイルとして低すぎたため
         引き上げ(一覧性を保つためcoverは維持)。 */
      display: block;
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 16px 16px 0 0;
      background: #e9f1f5;
    }

    .article-card-body {
      padding: 16px 4px 4px;
    }

    .article-card-date {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--subtext);
    }

    .article-card-category {
      display: inline-block;
      margin: 0 0 8px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #eef7fb;
      color: var(--blue);
      font-size: 10px;
      font-weight: 900;
    }

    .article-card-title {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 900;
      color: var(--navy);
    }

    .article-card-description {
      margin: 0;
      font-size: 12px;
      line-height: 1.7;
      color: var(--subtext);
    }

    .empty-state {
      padding: 30px 18px;
      border: 1px dashed var(--border);
      border-radius: 17px;
      color: var(--subtext);
      background: #f9fbfc;
      font-size: 12px;
      text-align: center;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--blue);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="brand-mini">
      <span class="brand-mini-icon">📖</span>
      マチナウ読み物
    </div>
    <h1>読みものを探す</h1>
  </div>

  <main>

    <div class="card">
      <form id="filterForm" class="filter-form">

        <!-- 読みもの一覧の整理(2026-10-07 代表決定)｜読みものは地域ではなく
             「いつの記事か(掲載年月＝publishedAt・初回公開日) × 何についての
             記事か(カテゴリー)」で探す。年月の選択肢は公開記事から自動生成する。 -->
        <div>
          <label for="filterMonthInput">掲載年月</label>
          <select id="filterMonthInput">
            <option value="">すべて</option>
          </select>
        </div>

        <div>
          <label for="filterCategoryInput">カテゴリー</label>
          <select id="filterCategoryInput">
            <option value="">すべて</option>
            <option value="街を知る">街を知る</option>
            <option value="街を歩く">街を歩く</option>
            <option value="食べる・飲む">食べる・飲む</option>
            <option value="見る・遊ぶ">見る・遊ぶ</option>
            <option value="地元のくらし">地元のくらし</option>
            <option value="旅のヒント">旅のヒント</option>
            <option value="ちょっと深掘り">ちょっと深掘り</option>
          </select>
        </div>

        <div class="filter-actions">
          <button type="button" id="resetButton" class="reset-button">条件をリセット</button>
        </div>

      </form>
    </div>

    <div id="articleList">
      <div class="empty-state">読み込んでいます…</div>
    </div>

    <a class="back-link" href="/">← マチナウTOPへ戻る</a>

  </main>

  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    // 画像UX改善Phase2｜app.js/api/moderate-submission.jsと同じロジック。
    // このページはapp.jsを読み込まない単独ページのため、同じ小さな
    // 純関数をそのまま複製している(共通化のための新規スクリプト読み込みは
    // 今回の範囲では見送り、既存の構成を変えない)。
    function buildOptimizedImageUrl(url, options) {
      if (typeof url !== "string" || url === "") {
        return url;
      }
      const uploadMarker = "/image/upload/";
      const uploadIndex = url.indexOf(uploadMarker);
      if (!url.includes("res.cloudinary.com") || uploadIndex === -1) {
        return url;
      }
      const width = options && Number.isFinite(options.width) && options.width > 0
        ? Math.round(options.width) : null;
      const transformationParts = ["f_auto", "q_auto", "c_limit"];
      if (width) {
        transformationParts.push("w_" + width);
      }
      const insertPosition = uploadIndex + uploadMarker.length;
      return url.slice(0, insertPosition) + transformationParts.join(",") + "/" + url.slice(insertPosition);
    }

    const filterForm = document.getElementById("filterForm");
    const filterMonthInput = document.getElementById("filterMonthInput");
    const filterCategoryInput = document.getElementById("filterCategoryInput");
    const resetButton = document.getElementById("resetButton");
    const articleList = document.getElementById("articleList");

    // 公開中の読みもの(publishedAtの新しい順)。最初に1回だけ取得し、
    // 掲載年月・カテゴリーの絞り込みはこの配列に対して行う(条件を変えるたびに
    // 再取得しない)。
    let loadedArticles = [];

    // "2026-10" → "2026年10月"。将来このページを多言語化する時はここだけを
    // 言語別(例："October 2026")にすればよい。
    function formatMonthLabel(monthKey) {
      const parts = String(monthKey).split("-");
      return parts.length === 2 ? Number(parts[0]) + "年" + Number(parts[1]) + "月" : monthKey;
    }

    // 掲載年月の選択肢は、公開記事に実際に存在する年月だけを新しい順に並べる
    // (HTMLへ年月を書き足し続けない)。
    function populateMonthOptions(articles) {
      const monthKeys = Array.from(
        new Set(
          articles
            .map(function(article) { return typeof article.publishedMonth === "string" ? article.publishedMonth : ""; })
            .filter(function(monthKey) { return monthKey !== ""; })
        )
      ).sort().reverse();

      filterMonthInput.innerHTML =
        '<option value="">すべて</option>' +
        monthKeys
          .map(function(monthKey) {
            return '<option value="' + escapeHtml(monthKey) + '">' + escapeHtml(formatMonthLabel(monthKey)) + '</option>';
          })
          .join("");
    }

    function renderArticleCard(article) {
      const slug = typeof article.slug === "string" ? article.slug : "";

      if (slug === "") {
        return "";
      }

      return (
        '<a class="card article-card" href="column/' + encodeURIComponent(slug) + '.html">' +
          (article.imageUrl ? '<img class="article-card-image" src="' + escapeHtml(buildOptimizedImageUrl(article.imageUrl, { width: 600 })) + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
          '<div class="article-card-body">' +
            (article.category ? '<span class="article-card-category">' + escapeHtml(article.category) + '</span>' : "") +
            '<p class="article-card-title">' + escapeHtml(article.title) + '</p>' +
            '<p class="article-card-description">' + escapeHtml(article.description) + '</p>' +
            (article.publishedDate ? '<p class="article-card-date">' + escapeHtml(article.publishedDate) + '</p>' : "") +
          '</div>' +
        '</a>'
      );
    }

    function renderFilteredArticles() {
      const month = filterMonthInput.value;
      const category = filterCategoryInput.value;

      const filteredArticles = loadedArticles.filter(function(article) {
        return (
          (month === "" || article.publishedMonth === month) &&
          (category === "" || article.category === category)
        );
      });

      if (filteredArticles.length === 0) {
        articleList.innerHTML = '<div class="empty-state">この条件に一致する読み物はまだありません。</div>';
        return;
      }

      articleList.innerHTML = filteredArticles.map(renderArticleCard).join("");
    }

    async function loadArticles() {
      articleList.innerHTML = '<div class="empty-state">読み込んでいます…</div>';

      const searchParams = new URLSearchParams({ mode: "publicListPublishedColumns" });

      try {
        const response = await fetch("/api/moderate-submission?" + searchParams.toString());
        const responseData = await response.json();

        if (!response.ok || !responseData || responseData.success !== true || !Array.isArray(responseData.articles)) {
          throw new Error("読み物一覧を取得できませんでした。");
        }

        loadedArticles = responseData.articles;
        populateMonthOptions(loadedArticles);
        renderFilteredArticles();
      } catch (error) {
        console.error("読み物一覧の取得に失敗しました：", error);
        articleList.innerHTML = '<div class="empty-state">読み物を読み込めませんでした。時間をおいて再度お試しください。</div>';
      }
    }

    filterForm.addEventListener("submit", function(event) {
      event.preventDefault();
      renderFilteredArticles();
    });

    filterMonthInput.addEventListener("change", renderFilteredArticles);
    filterCategoryInput.addEventListener("change", renderFilteredArticles);

    resetButton.addEventListener("click", function() {
      filterMonthInput.value = "";
      filterCategoryInput.value = "";
      renderFilteredArticles();
    });

    loadArticles();
  </script>

</body>
</html>
