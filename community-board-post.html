<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex, nofollow">

  <title>
    街の掲示板投稿｜マチナウ
  </title>

  <!-- 広告実証前 GA4最低限行動計測｜index.html・column記事ページと同じ
       Measurement ID(G-PGM7GNVQX8)・同じ考え方(machinau.jp/
       imamiru-web.vercel.app限定でのみ読み込み、Preview/localhostでは
       送信しない)。新しいMeasurement IDは作らず、gtag.jsの二重読み込みも
       発生しない(このページに他のgtag読み込みは存在しない)。 -->
  <script>
    (function () {
      if (location.hostname !== "machinau.jp" && location.hostname !== "imamiru-web.vercel.app") {
        return;
      }

      window.dataLayer = window.dataLayer || [];

      window.gtag = function () {
        dataLayer.push(arguments);
      };

      gtag("js", new Date());
      gtag("config", "G-PGM7GNVQX8");

      const gaScript = document.createElement("script");
      gaScript.async = true;
      gaScript.src =
        "https://www.googletagmanager.com/gtag/js?id=G-PGM7GNVQX8";
      document.head.appendChild(gaScript);
    })();
  </script>

  <!-- 街の掲示板 Phase1｜まだ本番導線には出さない実験ページ(URL直打ちで
       テストする想定、本部指示)。street/shop投稿(post.html)とは完全に
       独立した新規ページとして作成し、既存post.htmlのフォーム・GPS処理・
       Firestore書き込みロジックには一切触れない。 -->
  <style>
    :root {
      --navy: #071a33;
      --blue: #0788c9;
      --cyan: #04b7d7;
      --sky: #dff7ff;
      --white: #ffffff;
      --text: #15233a;
      --subtext: #697386;
      --border: #e2eaf1;
      --background: #f4f8fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 60px;
      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
      background: var(--background);
      color: var(--text);
    }

    header {
      padding: 28px 18px 40px;
      background: linear-gradient(135deg, #0687c5, #13c3ce);
      color: var(--white);
    }

    header .page-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 11px;
      font-weight: 900;
    }

    header h1 {
      margin: 16px 0 0;
      font-size: clamp(20px, 5vw, 26px);
      line-height: 1.5;
    }

    header p {
      margin: 10px 0 0;
      max-width: 560px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      line-height: 1.8;
    }

    main {
      width: min(100%, 560px);
      margin: -22px auto 0;
      padding: 0 18px;
    }

    .panel {
      margin-bottom: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 14px 40px rgba(20, 52, 82, 0.10);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
    }

    .char-count {
      margin-top: 4px;
      font-size: 12px;
      color: var(--subtext);
      text-align: right;
    }

    .region-box {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--sky);
      font-size: 13px;
    }

    .primary-button {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: var(--white);
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .secondary-button {
      display: block;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--navy);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .message-box {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.7;
    }

    .message-box.error {
      color: #b8354a;
    }

    .message-box.success {
      color: #17845a;
    }

    .completion-box {
      display: none;
      padding: 18px;
      border: 1px solid #cfeefa;
      border-radius: 14px;
      background: #effbff;
      color: #24627e;
      font-size: 14px;
      line-height: 1.9;
    }

    /* 街の掲示板 Phase6｜遠隔地(現在地以外)へ投稿する場合の投稿先明示バナー。
       現在地投稿(既存Phase1)の見た目は一切変更せず、遠隔地の場合だけこの
       バナーを表示する。 */
    .remote-region-banner {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .remote-region-banner h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .remote-region-banner p {
      margin: 0;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.8;
    }

    /* TOPへ戻る導線｜投稿ボタンより目立たせない補助リンク。 */
    .top-back-link-row {
      margin: 4px 0 0;
      text-align: center;
    }

    .top-back-link {
      display: inline-block;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--subtext);
      text-decoration: none;
    }
  </style>
  <!-- サイト全体改善 第2弾｜公開ページの共通の基準(見出し・押せる高さ・帯の色)。このページのスタイルの後に読む。 -->
  <link rel="stylesheet" href="machinau-pages.css">
</head>

<body class="machinau-page">

  <header>
    <div class="page-label" data-i18n="board_post_label">
      街の掲示板
    </div>

    <h1 data-i18n="board_post_heading">
      この街を訪れる人に、知ってほしいことを残そう
    </h1>

    <p data-i18n="board_post_lead">
      「豊見城といえばマンゴーだよ」「ここから見る夕日がきれいだよ」など、旅行者や次にこの街を訪れる人へ伝えたいひとことを投稿できます。内容を確認のうえ、街の掲示板に掲載します。
    </p>

    <!-- 街の掲示板 Phase6｜遠隔地投稿時だけ表示する投稿先バナー
         (「現在地にいます」という表現は使わない、本部指示)。 -->
    <div id="remoteRegionBanner" class="remote-region-banner">
      <h2 id="remoteRegionBannerHeading"></h2>
      <p id="remoteRegionBannerDescription"></p>
    </div>
  </header>

  <main>

    <div class="panel" id="formPanel">

      <div class="field" id="currentLocationField">
        <label data-i18n="board_post_current_location_label">
          現在地
        </label>

        <button
          id="detectLocationButton"
          type="button"
          class="secondary-button"
         data-i18n="board_post_detect_location">
          現在地から対象の街を調べる
        </button>

        <div
          id="regionResultBox"
          class="region-box"
          style="display:none; margin-top:10px;"
        ></div>

        <div
          id="locationMessage"
          class="message-box"
        ></div>
      </div>

      <div class="field">
        <label for="postTextInput" data-i18n="board_post_text_label">
          投稿内容
        </label>

        <textarea
          id="postTextInput"
          maxlength="300"
          placeholder="例：豊見城といえばマンゴーだよ。ぜひ食べてみて！" data-i18n-placeholder="board_post_text_placeholder"
        ></textarea>

        <div class="char-count">
          <span id="charCountText">0</span> / 300
        </div>
      </div>

      <button
        id="submitButton"
        type="button"
        class="primary-button"
        disabled
       data-i18n="board_post_submit">
        投稿する
      </button>

      <div
        id="submitMessage"
        class="message-box"
      ></div>

    </div>

    <div
      id="completionBox"
      class="completion-box"
     data-i18n-lines="board_post_done">
      投稿ありがとうございます。<br>
      内容を確認後、街の掲示板に掲載します。
    </div>

    <p class="top-back-link-row">
      <a class="top-back-link" href="/index.html" data-i18n="board_post_back_top_arrow">← マチナウTOPへ戻る</a>
    </p>

  </main>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="firebase.js"></script>

  <script src="translations.js"></script>
  <script>
    // サイト全体改善 第4弾｜TOP で選んだ言語(machinauLanguage)を引き継ぐ(値が無い・不正なら日本語)。
    // 英語の時だけ、data-i18n 系の属性が付いた固定の文言を辞書(translations.js)で差し替える。
    // 日本語は HTML のまま。このページのスクリプトより先に動く(後から書き換える文言は tr() で引く)。
    const PAGE_LANGUAGE = (function () {
      let stored = null;
      try {
        stored = localStorage.getItem("machinauLanguage");
      } catch (error) {
        stored = null;
      }
      return typeof stored === "string" && MACHINAU_SUPPORTED_LANGUAGES.includes(stored) ? stored : MACHINAU_DEFAULT_LANGUAGE;
    })();
    function tr(key, params) {
      let text = getMachinauTranslation(key, PAGE_LANGUAGE);
      Object.keys(params || {}).forEach(function (name) {
        text = text.split("{" + name + "}").join(String(params[name]));
      });
      return text;
    }
    (function applyPageLanguage() {
      if (PAGE_LANGUAGE === MACHINAU_DEFAULT_LANGUAGE) {
        return;
      }
      document.documentElement.lang = PAGE_LANGUAGE;
      document.title = tr("board_post_doc_title");
      document.querySelectorAll("[data-i18n]").forEach(function (element) {
        element.textContent = tr(element.getAttribute("data-i18n"));
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(function (element) {
        element.placeholder = tr(element.getAttribute("data-i18n-placeholder"));
      });
      // 訳文の改行(\n)は <br> にする(辞書の固定の文言だけで、利用者の入力は入らない)。
      document.querySelectorAll("[data-i18n-lines]").forEach(function (element) {
        const lines = tr(element.getAttribute("data-i18n-lines")).split("\n");
        element.textContent = "";
        lines.forEach(function (line, index) {
          if (index > 0) {
            element.appendChild(document.createElement("br"));
          }
          element.appendChild(document.createTextNode(line));
        });
      });
    })();
  </script>
  <script>
    // サイト全体改善 第4弾｜サーバーが返す利用者向けのメッセージ(日本語)を、英語の時は対応する訳にする。
    // 知らないメッセージは汎用の案内(fallbackKey)。日本語の時はサーバーの文言のまま。
    const SERVER_MESSAGE_KEYS = {
      "認証情報がありません。": "board_post_server_auth",
      "認証情報が正しくありません。": "board_post_server_auth",
      "入力内容を確認してください。": "board_post_server_invalid",
      "URLを含む投稿はできません。URLを除いて投稿してください。": "board_post_server_url",
      "短時間に続けて投稿されています。少し待ってから、もう一度お試しください。": "board_post_server_rate",
      "地域情報を確認できませんでした。時間をおいて、もう一度お試しください。": "board_post_server_region",
      "投稿の送信中にエラーが発生しました。時間をおいて、もう一度お試しください。": "board_post_server_error"
    };
    function localizeServerMessage(message, fallbackKey) {
      if (PAGE_LANGUAGE === MACHINAU_DEFAULT_LANGUAGE) {
        return typeof message === "string" && message !== "" ? message : tr(fallbackKey);
      }
      return typeof message === "string" && SERVER_MESSAGE_KEYS[message] ? tr(SERVER_MESSAGE_KEYS[message]) : tr(fallbackKey);
    }

    // 既存app.jsのGOOGLE_MAPS_SCRIPT_URLと同じ公開鍵(クライアント公開前提、
    // referrer制限あり)をそのまま使う。新しい鍵は発行しない。
    const GOOGLE_MAPS_SCRIPT_URL =
      "https://maps.googleapis.com/maps/api/js?key=AIzaSyC7LLuNBYIXKT1YcrIaiuwyFssKQyMMjkU&libraries=places";

    let googleMapsLoadPromise = null;

    function ensureGoogleMapsLoadedForCommunityBoard() {
      if (googleMapsLoadPromise) {
        return googleMapsLoadPromise;
      }

      if (typeof google !== "undefined" && google.maps && google.maps.Geocoder) {
        googleMapsLoadPromise = Promise.resolve(true);
        return googleMapsLoadPromise;
      }

      googleMapsLoadPromise = new Promise(function (resolve) {
        const script = document.createElement("script");
        script.src = GOOGLE_MAPS_SCRIPT_URL;
        script.async = true;
        script.defer = true;

        script.onload = function () {
          resolve(true);
        };

        script.onerror = function () {
          googleMapsLoadPromise = null;
          resolve(false);
        };

        document.head.appendChild(script);
      });

      return googleMapsLoadPromise;
    }

    function findAddressComponent(addressComponents, typeName) {
      if (!Array.isArray(addressComponents)) {
        return null;
      }

      return (
        addressComponents.find(function (component) {
          return Array.isArray(component.types) && component.types.includes(typeName);
        }) || null
      );
    }

    // Phase0実証済み：那覇市の順方向/逆方向Geocoderがいずれも
    // types=["locality","political"]の同一place_idへ到達することを
    // 実機確認済み。Phase1では現在地(逆Geocoder)経路のみを実装する。
    // 国別のtype優先順位(postal_town等)への対応は将来工程。
    function resolveCommunityBoardRegionFromGeocoderResults(results) {
      const localityResult =
        Array.isArray(results)
          ? results.find(function (result) {
              return (
                Array.isArray(result.types) &&
                result.types.includes("locality") &&
                typeof result.place_id === "string" &&
                result.place_id !== ""
              );
            })
          : null;

      if (!localityResult) {
        return null;
      }

      const countryComponent = findAddressComponent(
        localityResult.address_components,
        "country"
      );

      const localityComponent = findAddressComponent(
        localityResult.address_components,
        "locality"
      );

      const countryCode =
        countryComponent && typeof countryComponent.short_name === "string"
          ? countryComponent.short_name
          : "";

      const regionName =
        localityComponent && typeof localityComponent.long_name === "string"
          ? localityComponent.long_name
          : "";

      if (countryCode === "" || regionName === "") {
        return null;
      }

      return {
        googlePlaceId: localityResult.place_id,
        countryCode: countryCode,
        regionName: regionName,
        administrativeLevel: "locality"
      };
    }

    let resolvedCommunityBoardRegion = null;

    const detectLocationButton = document.getElementById("detectLocationButton");
    const currentLocationField = document.getElementById("currentLocationField");
    const regionResultBox = document.getElementById("regionResultBox");
    const locationMessage = document.getElementById("locationMessage");
    const postTextInput = document.getElementById("postTextInput");
    const charCountText = document.getElementById("charCountText");
    const submitButton = document.getElementById("submitButton");
    const submitMessage = document.getElementById("submitMessage");
    const formPanel = document.getElementById("formPanel");
    const completionBox = document.getElementById("completionBox");
    const remoteRegionBanner = document.getElementById("remoteRegionBanner");
    const remoteRegionBannerHeading = document.getElementById("remoteRegionBannerHeading");
    const remoteRegionBannerDescription = document.getElementById("remoteRegionBannerDescription");

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = "message-box" + (type ? " " + type : "");
    }

    function updateSubmitButtonEnabled() {
      submitButton.disabled = !(
        resolvedCommunityBoardRegion &&
        postTextInput.value.trim() !== ""
      );
    }

    // 街の掲示板 Phase6｜TOPの「○○について投稿する」リンクが付けた
    // URLパラメータを読み取る。regionId自体はここでもどこでも一切扱わない
    // (サーバー側が毎回googlePlaceId/countryCodeから解決する、本部指示)。
    // Phase4のresolveGooglePlaceIdForAreaName()と同じ4フィールドのみを
    // 受け渡しに使う既存の考え方をそのまま踏襲する。
    const remotePostUrlParams = new URLSearchParams(window.location.search);
    const remoteGooglePlaceId = remotePostUrlParams.get("googlePlaceId") || "";
    const remoteCountryCode = remotePostUrlParams.get("countryCode") || "";
    const remoteRegionName = remotePostUrlParams.get("regionName") || "";
    const remoteAdministrativeLevel = remotePostUrlParams.get("administrativeLevel") || "";

    const isRemotePostMode =
      remoteGooglePlaceId !== "" &&
      remoteCountryCode !== "" &&
      remoteRegionName !== "";

    if (isRemotePostMode) {
      resolvedCommunityBoardRegion = {
        googlePlaceId: remoteGooglePlaceId,
        countryCode: remoteCountryCode,
        regionName: remoteRegionName,
        administrativeLevel: remoteAdministrativeLevel
      };

      // 現在地取得の導線ごと隠す(GPSを要求しない、投稿先はすでに確定済み、
      // 本部指示)。「現在地にいます」という表現は使わない。
      if (currentLocationField) {
        currentLocationField.style.display = "none";
      }

      if (remoteRegionBanner && remoteRegionBannerHeading && remoteRegionBannerDescription) {
        remoteRegionBannerHeading.textContent = tr("board_post_remote_heading", { region: remoteRegionName });
        remoteRegionBannerDescription.textContent =
          tr("board_post_remote_lead", { region: remoteRegionName });
        remoteRegionBanner.style.display = "block";
      }

      updateSubmitButtonEnabled();
    }

    postTextInput.addEventListener("input", function () {
      charCountText.textContent = String(postTextInput.value.length);
      updateSubmitButtonEnabled();
    });

    // 街の掲示板 停止防止｜現在地の取得(10秒)と、地図による街の判定(8秒、地図の読み込みを含む)に
    // 上限を設ける。応答が無い場合(位置情報の確認が終わらない・地図キーが使えない環境で
    // 判定が返らない等)も、必ずエラーを表示して「現在地から調べる」を押し直せる状態に戻す。
    // 街が確定するまでは投稿ボタンを有効にしない(updateSubmitButtonEnabled())。
    const COMMUNITY_BOARD_GEOLOCATION_TIMEOUT_MS = 10000;
    const COMMUNITY_BOARD_GEOCODER_TIMEOUT_MS = 8000;
    let locationRequestSequence = 0;

    function geocodeCommunityBoardLocationWithTimeout(latitude, longitude) {
      return new Promise(function (resolve) {
        let settled = false;
        const finish = function (result) {
          if (!settled) {
            settled = true;
            clearTimeout(timeoutId);
            resolve(result);
          }
        };
        const timeoutId = setTimeout(function () {
          finish({ status: "timeout" });
        }, COMMUNITY_BOARD_GEOCODER_TIMEOUT_MS);

        ensureGoogleMapsLoadedForCommunityBoard()
          .then(function (mapsLoaded) {
            if (!mapsLoaded || typeof google === "undefined" || !google.maps || !google.maps.Geocoder) {
              finish({ status: "maps_unavailable" });
              return;
            }
            new google.maps.Geocoder().geocode(
              { location: { lat: latitude, lng: longitude } },
              function (results, status) {
                finish({ status: status, results: results });
              }
            );
          })
          .catch(function (error) {
            console.error("街の特定に失敗しました：", error);
            finish({ status: "error" });
          });
      });
    }

    detectLocationButton.addEventListener("click", function () {
      if (!navigator.geolocation) {
        showMessage(locationMessage, tr("board_post_error_no_geolocation"), "error");
        return;
      }

      const requestSequence = ++locationRequestSequence;
      let geolocationSettled = false;

      // 調べ直す間は、前回の街を使わない(街が確定するまで投稿ボタンは無効)。
      resolvedCommunityBoardRegion = null;
      updateSubmitButtonEnabled();
      detectLocationButton.disabled = true;
      showMessage(locationMessage, tr("board_post_locating"), "");
      regionResultBox.style.display = "none";

      function finishWithError(text) {
        if (requestSequence !== locationRequestSequence) {
          return;
        }
        showMessage(locationMessage, text, "error");
        detectLocationButton.disabled = false;
      }

      // ブラウザのtimeoutは位置情報の許可確認中は数えないため、同じ10秒の上限を別にも設ける。
      const geolocationGuardId = setTimeout(function () {
        if (!geolocationSettled) {
          geolocationSettled = true;
          finishWithError(tr("board_post_error_timeout"));
        }
      }, COMMUNITY_BOARD_GEOLOCATION_TIMEOUT_MS);

      navigator.geolocation.getCurrentPosition(
        async function (position) {
          if (geolocationSettled) {
            return;
          }
          geolocationSettled = true;
          clearTimeout(geolocationGuardId);

          const geocodeResult = await geocodeCommunityBoardLocationWithTimeout(
            position.coords.latitude,
            position.coords.longitude
          );

          if (requestSequence !== locationRequestSequence) {
            return;
          }

          if (geocodeResult.status === "timeout") {
            finishWithError(tr("board_post_error_no_response"));
            return;
          }

          if (geocodeResult.status === "maps_unavailable") {
            finishWithError(tr("board_post_error_maps"));
            return;
          }

          if (geocodeResult.status !== "OK" || !Array.isArray(geocodeResult.results)) {
            finishWithError(tr("board_post_error_region"));
            return;
          }

          const region = resolveCommunityBoardRegionFromGeocoderResults(geocodeResult.results);

          if (!region) {
            finishWithError(tr("board_post_error_region"));
            return;
          }

          resolvedCommunityBoardRegion = region;

          regionResultBox.textContent = tr("board_post_region_result", { region: region.regionName });
          regionResultBox.style.display = "";

          showMessage(locationMessage, "", "");
          detectLocationButton.disabled = false;
          updateSubmitButtonEnabled();
        },
        function (error) {
          if (geolocationSettled) {
            return;
          }
          geolocationSettled = true;
          clearTimeout(geolocationGuardId);

          finishWithError(
            error && error.code === 3
              ? tr("board_post_error_timeout")
              : tr("board_post_error_location")
          );
        },
        {
          timeout: COMMUNITY_BOARD_GEOLOCATION_TIMEOUT_MS,
          maximumAge: 60000
        }
      );
    });

    let anonymousAuthPromise = null;

    // 街の掲示板 運営ログイン維持｜Firebase Authenticationはfirebase.auth()を最初に呼んだ時に
    // 保存済みのログイン(運営・一般ユーザー)を復元し始めるため、ページ読み込み時に初期化し、
    // onAuthStateChangedの最初の通知(=復元完了)を待ってからユーザーを判定する。
    // 復元前にsignInAnonymously()を呼ぶと、復元された運営ログインが匿名ユーザーで置き換わる。
    // 初期化に失敗・時間切れの場合は匿名ログインへ切り替えず、エラーとして止める。
    const COMMUNITY_BOARD_AUTH_READY_TIMEOUT_MS = 10000;
    let communityBoardAuthReadyPromise = null;

    function waitForCommunityBoardAuthReady() {
      if (communityBoardAuthReadyPromise) {
        return communityBoardAuthReadyPromise;
      }

      communityBoardAuthReadyPromise = new Promise(function (resolve, reject) {
        let auth;

        try {
          if (typeof firebase === "undefined" || !firebase.auth) {
            throw new Error(tr("board_post_error_auth_unavailable"));
          }

          auth = firebase.auth();
        } catch (error) {
          reject(error);
          return;
        }

        let settled = false;
        let unsubscribe = null;

        const finish = function (error) {
          if (settled) {
            return;
          }

          settled = true;
          clearTimeout(timeoutId);

          if (typeof unsubscribe === "function") {
            unsubscribe();
          }

          if (error) {
            reject(error);
          } else {
            resolve(auth);
          }
        };

        const timeoutId = setTimeout(function () {
          finish(new Error(tr("board_post_error_auth_timeout")));
        }, COMMUNITY_BOARD_AUTH_READY_TIMEOUT_MS);

        unsubscribe = auth.onAuthStateChanged(
          function () {
            finish(null);
          },
          function (error) {
            finish(error || new Error(tr("board_post_error_auth")));
          }
        );

        if (settled && typeof unsubscribe === "function") {
          unsubscribe();
        }
      }).catch(function (error) {
        // 次の投稿操作で、もう一度初期化からやり直せるようにする。
        communityBoardAuthReadyPromise = null;
        console.error("街の掲示板：ログイン状態の確認に失敗しました：", error);
        throw new Error(tr("board_post_error_auth_reload"));
      });

      return communityBoardAuthReadyPromise;
    }

    // ページ読み込み時に初期化を始める(投稿ボタンを押すまでに復元を終わらせておく)。
    waitForCommunityBoardAuthReady().catch(function () {});

    async function getAnonymousIdTokenForCommunityBoard() {
      if (typeof firebase === "undefined" || !firebase.auth) {
        throw new Error(tr("board_post_error_prepare"));
      }

      const auth = await waitForCommunityBoardAuthReady();

      // 復元済みのログイン(運営・一般ユーザー・以前の匿名ユーザー)があれば、そのまま使う。
      if (auth.currentUser) {
        return auth.currentUser.getIdToken();
      }

      // 誰もログインしていない時だけ匿名ログインする。
      if (!anonymousAuthPromise) {
        anonymousAuthPromise = auth
          .signInAnonymously()
          .then(function (credential) {
            return credential.user;
          })
          .catch(function (error) {
            anonymousAuthPromise = null;
            throw error;
          });
      }

      return anonymousAuthPromise.then(function (user) {
        return user.getIdToken();
      });
    }

    submitButton.addEventListener("click", async function () {
      if (!resolvedCommunityBoardRegion) {
        showMessage(submitMessage, tr("board_post_error_need_region"), "error");
        return;
      }

      const text = postTextInput.value.trim();

      if (text === "") {
        showMessage(submitMessage, tr("board_post_error_empty"), "error");
        return;
      }

      submitButton.disabled = true;
      showMessage(submitMessage, tr("board_post_sending"), "");

      try {
        const idToken = await getAnonymousIdTokenForCommunityBoard();

        const response = await fetch("/api/moderate-submission", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + idToken
          },
          body: JSON.stringify({
            mode: "communityBoardPostCreate",
            text: text,
            googlePlaceId: resolvedCommunityBoardRegion.googlePlaceId,
            countryCode: resolvedCommunityBoardRegion.countryCode,
            regionName: resolvedCommunityBoardRegion.regionName,
            administrativeLevel: resolvedCommunityBoardRegion.administrativeLevel
          })
        });

        let responseData = null;

        try {
          responseData = await response.json();
        } catch (jsonError) {
          throw new Error(tr("board_post_error_send"));
        }

        if (!response.ok || !responseData || responseData.success !== true) {
          throw new Error(localizeServerMessage(responseData && responseData.message, "board_post_error_send"));
        }

        formPanel.style.display = "none";
        completionBox.style.display = "block";

        // 広告実証前 GA4最低限行動計測｜サーバーの投稿作成成功(success:true)
        // が確定した、この1箇所でのみ送信する(pendingでも成功扱い)。
        // 投稿本文・IP・個人情報・地域情報は一切送らない。gtag未ロード時は
        // 何もしない(本体機能である投稿完了表示には影響させない)。
        try {
          if (typeof gtag === "function") {
            gtag("event", "community_board_post_success");
          }
        } catch (analyticsError) {
          // Analytics送信の失敗が投稿完了表示に影響しないようにする。
        }
      } catch (error) {
        console.error("街の掲示板投稿エラー：", error);
        showMessage(submitMessage, error.message || tr("board_post_error_send"), "error");
        submitButton.disabled = false;
      }
    });
  </script>

</body>
</html>
